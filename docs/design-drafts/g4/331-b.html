<!doctype html>
<html lang="en">
<head>

<title>G4 · 3.3.1 B · Motion: Subtle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
  // Set theme/lang before paint to avoid a flash.
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.documentElement.lang = q.get('lang') === 'ko' ? 'ko' : 'en';
  })();
</script>
<style>
  /* =====================================================================
     TOKENS — G4 base (round-1 + round-2 picks merged). Round-3 drafts copy this
     file; this block later becomes src/styles/tokens.css.
     Everything below "BASE" uses these variables; no raw colors/fonts there.
     Picks: 3.1.1 A type · 3.1.2 A Slate Ink · 3.1.3 C sidebar · 3.1.6 C mobile ·
     3.2.1 A · 3.2.2 B · 3.2.4 B · 3.2.5 B · 3.2.6 A · 3.2.7 C · 3.2.8 A.
     ===================================================================== */
  :root {
    /* --- font families (3.1.1 A: Geist + Geist Mono, Pretendard for Hangul) --- */
    --font: "Geist", "Pretendard Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-ko: "Pretendard Variable", "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --font-display: var(--font);
    --font-meta: "Geist Mono", "Pretendard Variable", ui-monospace, "SFMono-Regular", monospace;

    /* --- type scale (px @16): 11 / 12 / 13 / 15 / 17 / 22 / 30 --- */
    --fs-2xs: 0.6875rem;
    --fs-xs: 0.75rem;
    --fs-sm: 0.8125rem;
    --fs-md: 0.9375rem;
    --fs-lg: 1.0625rem;
    --fs-xl: 1.375rem;
    --fs-2xl: 1.875rem;
    --fw-name: 600; --fw-tagline: 500; --fw-tagline-ko: 600; --fw-title: 600; --fw-strong: 600; --fw-eyebrow: 500;
    --lh-body: 1.6; --lh-body-ko: 1.75; --lh-tagline: 1.22; --lh-tagline-ko: 1.4;
    --ls-body: -0.005em; --ls-body-ko: -0.01em; --ls-name: -0.02em; --ls-tagline: -0.03em; --ls-tagline-ko: -0.035em;
    --ls-title: -0.012em; --ls-title-ko: -0.02em; --ls-eyebrow: 0.06em; --ls-eyebrow-ko: 0;

    /* --- color: light (3.1.2 A Slate Ink) --- */
    color-scheme: light;
    --bg: #f3f5f8;
    --surface: #ffffff;
    --line: #dfe3ea;
    --line-strong: #c5ccd6;
    --text: #141a22;
    --text-2: #475260;
    --text-3: #5f6a78;
    --chip: #eef1f5;
    --header-bg: rgba(243, 245, 248, 0.9);
    --scrim: rgba(22, 25, 29, 0.32);
    --photo-ring: var(--line);
    --photo-filter: none;
    --accent: #2b5a8a;
    --accent-soft: #e6edf6;
    --focus: var(--accent);

    /* --- radius --- */
    --radius: 10px;
    --radius-sm: 6px;
    --radius-xs: 4px;
    --radius-pill: 999px;

    /* --- spacing --- */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

    /* --- layout --- */
    --sidebar: 320px;
    --main: 960px;
    --header-h: 56px;
    --sb-photo-w: 132px; /* 3.1.3 C sidebar photo */
    --sb-key: 64px;      /* 3.1.3 C key column */
    --sheet-w: 340px;    /* 3.1.6 C mobile menu sheet */
    --row-when: 148px;   /* 3.2.6 A period column */
    --logo-h: 22px;      /* 3.2.7 C logo box height (scaled per logo by --s) */
    --logo-w: 124px;     /* 3.2.7 C max logo width (fits the date column) */
    --logo-h-sm: 14px;   /* 3.2.7 C logo in project meta */
    --logo-filter: brightness(0);  /* official artwork -> one ink */
    --logo-op: 0.62;               /* resting ink weight (reads near --text-3) */
    --logo-op-cur: 0.92;           /* current employer */

    /* --- motion (3.3.1 B Subtle) --- */
    --dur: 180ms;            /* hover colour, underline, chevron */
    --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
    --m-rise: 8px;           /* section entrance distance */
    --m-reveal: 480ms;       /* section fade/rise, once per section */
    --m-nav: 260ms;          /* tab underline slide */
    --m-theme: 240ms;        /* theme cross-fade (View Transitions) */
    --m-lang: 200ms;         /* language cross-fade (cross-document @view-transition on the site) */
    --m-sheet: var(--dur);   /* menu sheet: base 24px nudge + fade */
    --row-tint: var(--accent-soft); /* hover tint on linked project rows */

    --mask-solid: #000; /* mask alpha only, not a visible color */
  }
  html:lang(ko) { --font-display: var(--font-ko); }

  /* --- color: dark (3.1.2 A Slate Ink). Same values in both blocks below:
         OS preference when no explicit light choice, and explicit [data-theme=dark]. --- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #151b23;
      --line: #252d38;
      --line-strong: #364150;
      --text: #e6eaf0;
      --text-2: #b1bac6;
      --text-3: #8b95a3;
      --chip: #1d2530;
      --header-bg: rgba(13, 17, 23, 0.9);
      --scrim: rgba(0, 0, 0, 0.6);
      --photo-ring: var(--line-strong);
      --photo-filter: brightness(0.86); /* tone down the white photo backdrop on dark */
      --accent: #8db3e2;
      --accent-soft: #1a283b;
      --logo-filter: brightness(0) invert(1);
      --logo-op: 0.6;
      --logo-op-cur: 0.9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #151b23;
    --line: #252d38;
    --line-strong: #364150;
    --text: #e6eaf0;
    --text-2: #b1bac6;
    --text-3: #8b95a3;
    --chip: #1d2530;
    --header-bg: rgba(13, 17, 23, 0.9);
    --scrim: rgba(0, 0, 0, 0.6);
    --photo-ring: var(--line-strong);
    --photo-filter: brightness(0.86);
    --accent: #8db3e2;
    --accent-soft: #1a283b;
    --logo-filter: brightness(0) invert(1);
    --logo-op: 0.6;
    --logo-op-cur: 0.9;
  }
  /* ============================ BASE ============================ */

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: var(--fs-md);
    line-height: 1.6;
    font-feature-settings: "tnum" 0;
    -webkit-font-smoothing: antialiased;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }
  :lang(ko) body, :lang(ko) { font-family: var(--font-ko); }
  html:lang(ko) body { line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -0.005em; }
  html:lang(en) body { letter-spacing: -0.003em; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-xs); }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

  /* ---------- Layout ---------- */
  /* Centered on wide screens (from A2): sidebar + main share one column; the top menu lives inside it. */
  .shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; max-width: calc(var(--sidebar) + var(--main)); margin: 0 auto; }
  aside.sidebar {
    position: sticky; top: 0; height: 100vh;
    border-right: 1px solid var(--line);
    padding: var(--sp-7) var(--sp-6);
    display: flex; flex-direction: column; gap: var(--sp-5);
    overflow-y: auto;
  }
  .col { min-width: 0; }
  main { padding: var(--sp-6) var(--sp-7) var(--sp-8); max-width: var(--main); width: 100%; }

  /* ---------- Top menu (sticky, right column) ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg);
    -webkit-backdrop-filter: saturate(1.2) blur(8px); backdrop-filter: saturate(1.2) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .bar {
    max-width: var(--main); height: var(--header-h); padding: 0 var(--sp-7);
    display: flex; align-items: center; gap: var(--sp-4);
  }
  .topbar nav { flex: 1; min-width: 0; align-self: stretch; display: flex; }
  .tabs { display: flex; gap: var(--sp-5); margin: 0; padding: 0; list-style: none; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs li { display: flex; }
  .tabs a {
    position: relative; display: flex; align-items: center; white-space: nowrap;
    font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); text-decoration: none;
    transition: color var(--dur) ease;
  }
  .tabs a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px;
    background: var(--accent); transform: scaleX(0); transition: transform var(--dur) ease;
  }
  .tabs a:hover { color: var(--text); }
  .tabs a[aria-current="true"] { color: var(--text); }
  .tabs a[aria-current="true"]::after { transform: scaleX(1); }
  .tabs a:focus-visible { outline-offset: -2px; }

  /* ---------- Sidebar ---------- */
  .photo {
    width: 112px; height: auto; aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: var(--radius); border: 1px solid var(--photo-ring);
    background: var(--chip); display: block; filter: var(--photo-filter);
  }
  .name { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.25; }
  .headline { margin: var(--sp-1) 0 0; color: var(--accent); font-weight: 500; font-size: var(--fs-md); }
  .role { margin: var(--sp-1) 0 0; color: var(--text-2); font-size: var(--fs-sm); }
  .contact { list-style: none; margin: 0; padding: var(--sp-4) 0 0; border-top: 1px solid var(--line); display: grid; gap: var(--sp-2); }
  .contact a {
    display: flex; align-items: center; gap: var(--sp-3);
    text-decoration: none; color: var(--text-2); font-size: var(--fs-sm);
    transition: color var(--dur) ease;
  }
  .contact a:hover { color: var(--accent); }
  .contact svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .contact .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .controls { display: flex; gap: var(--sp-2); align-items: center; flex: none; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 2px; background: var(--surface); }
  .seg button {
    font: inherit; font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.02em;
    border: 0; background: none; color: var(--text-3); cursor: pointer;
    padding: 4px 10px; border-radius: var(--radius-pill); min-height: 28px;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .icon-btn {
    display: inline-grid; place-items: center; width: 34px; height: 34px;
    border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface);
    color: var(--text-2); cursor: pointer; transition: color var(--dur) ease, border-color var(--dur) ease;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--line-strong); }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  [data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }

  /* ---------- Cards / sections ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--sp-6); margin-bottom: var(--sp-5);
    scroll-margin-top: calc(var(--header-h) + var(--sp-5));
  }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-5); }
  .sec-head h2 {
    margin: 0; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3);
  }
  html:lang(ko) .sec-head h2 { letter-spacing: 0.04em; font-size: var(--fs-sm); }
  .sec-head .meta { font-size: var(--fs-xs); color: var(--text-3); }

  /* About */
  .tagline { margin: 0 0 var(--sp-4); font-size: var(--fs-2xl); line-height: 1.3; font-weight: 500; letter-spacing: -0.02em; max-width: 30ch; }
  html:lang(ko) .tagline { line-height: 1.45; letter-spacing: -0.03em; max-width: 24ch; }
  .tagline { text-wrap: balance; }
  .about { margin: 0; color: var(--text-2); max-width: 68ch; }

  .traj { list-style: none; margin: var(--sp-6) 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-4); }
  .traj li { position: relative; padding-top: var(--sp-5); }
  .traj li::before { content: ""; position: absolute; top: 4px; left: 0; right: calc(-1 * var(--sp-4)); height: 1px; background: var(--line-strong); }
  .traj li:last-child::before { right: 0; background: linear-gradient(to right, var(--accent), transparent); }
  .traj li::after { content: ""; position: absolute; top: 0; left: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line-strong); }
  .traj li:last-child::after { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .traj .yrs { font-size: var(--fs-xs); color: var(--text-3); }
  .traj h3 { margin: 2px 0 var(--sp-1); font-size: var(--fs-md); font-weight: 600; line-height: 1.35; }
  .traj li:last-child h3 { color: var(--accent); }
  .traj p { margin: 0; font-size: var(--fs-sm); color: var(--text-2); line-height: 1.55; }

  .skills { margin: var(--sp-6) 0 0; padding: 0; border-top: 1px solid var(--line); }
  .skills div { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
  .skills div:last-child { border-bottom: 0; padding-bottom: 0; }
  .skills dt { font-size: var(--fs-sm); font-weight: 600; }
  .skills dd { margin: 0; font-size: var(--fs-sm); color: var(--text-2); }

  /* Selected Work */
  .proj { position: relative; }
  .proj h3 a { color: inherit; text-decoration: none; }
  .proj h3 a::after { content: ""; position: absolute; inset: 0 calc(-1 * var(--sp-2)); border-radius: var(--radius-sm); }
  .proj h3 a:focus-visible { outline: none; }
  .proj h3 a:focus-visible::after { outline: 2px solid var(--focus); outline-offset: 0; }
  .proj:has(h3 a):hover h3 { color: var(--accent); }
  .proj h3 { transition: color var(--dur) ease; }
  .proj-meta { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-xs); color: var(--text-3); margin: 0; }
  .proj-meta .org { color: var(--text-2); font-weight: 500; }
  .proj h3 { margin: 0; font-size: var(--fs-lg); font-weight: 600; line-height: 1.35; }
  .proj .sum { margin: 0; font-size: var(--fs-sm); color: var(--text-2); max-width: 64ch; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 500; color: var(--accent); }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .go { color: var(--text-3); transition: color var(--dur) ease, transform var(--dur) ease; }
  .go svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; display: block; }
  .proj:has(h3 a):hover .go { color: var(--accent); transform: translateX(3px); }
  /* 321-A: numbered rows divided by hairlines, no inner boxes */
  .work { list-style: none; margin: 0; padding: 0; }
  .proj { display: grid; grid-template-columns: 48px minmax(0, 1fr) 24px; gap: 0 var(--sp-4); padding: var(--sp-5) 0; border-top: 1px solid var(--line); }
  .proj:first-child { border-top: 0; padding-top: var(--sp-1); }
  .proj:last-child { padding-bottom: 0; }
  .idx { font-family: var(--font-meta); font-size: var(--fs-sm); color: var(--text-3); padding-top: 2px; }
  .proj:has(h3 a):hover .idx { color: var(--accent); }
  .body { display: grid; gap: 6px; min-width: 0; }
  .out { margin: 0; font-size: var(--fs-sm); color: var(--text); max-width: 64ch; }
  .out .k { font-family: var(--font-meta); font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); margin-right: var(--sp-2); }
  html:lang(ko) .out .k { font-family: var(--font-ko); font-size: var(--fs-xs); letter-spacing: 0; }
  .body .tags { margin-top: var(--sp-1); }
  .go { padding-top: 4px; }
  @media (max-width: 560px) {
    .proj { grid-template-columns: 28px minmax(0, 1fr); }
    .idx { font-size: var(--fs-xs); padding-top: 3px; }
    .go { display: none; }
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tag { font-size: var(--fs-xs); padding: 2px 8px; border-radius: var(--radius-pill); background: var(--chip); color: var(--text-2); line-height: 1.6; }
  .tag.k { background: var(--accent-soft); color: var(--accent); }
  .badge { font-size: var(--fs-2xs); font-weight: 500; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--radius-xs); color: var(--text-2); }


  .filters { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .st { display: inline-flex; align-items: center; gap: 5px; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--text-3); }
  .st.reg::before { background: var(--accent); border-color: var(--accent); }
  .st.reg { color: var(--text-2); }
  .toggle-all {
    margin-top: var(--sp-4); font: inherit; font-size: var(--fs-sm); font-weight: 500;
    background: none; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 6px 14px;
    color: var(--text-2); cursor: pointer; transition: border-color var(--dur) ease, color var(--dur) ease;
  }
  .toggle-all:hover { color: var(--accent); border-color: var(--line-strong); }

  /* 3.1.6 C: slim bar identity + menu button (mobile only) and the menu sheet */
  .bar-id, .menu-btn, .lang-btn { display: none; }
  .lang-btn { width: auto; padding: 0 var(--sp-3); font: inherit; font-family: var(--font-meta); font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.02em; }
  .sheet {
    margin: 0 0 0 auto; padding: 0; border: 0; border-left: 1px solid var(--line);
    width: min(var(--sheet-w), 88vw); height: 100dvh; max-width: none; max-height: none;
    background: var(--surface); color: var(--text);
  }
  .sheet::backdrop { background: var(--scrim); }
  .sheet[open] { animation: sheet-in var(--dur) ease-out; }
  .sheet[open]::backdrop { animation: fade-in var(--dur) ease-out; }
  @keyframes sheet-in { from { transform: translateX(24px); opacity: 0; } }
  @keyframes fade-in { from { opacity: 0; } }
  .sheet-in { min-height: 100%; display: flex; flex-direction: column; gap: var(--sp-6); padding: var(--sp-3) var(--sp-5) var(--sp-6); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; height: var(--header-h); }
  .sheet-head h2, .sheet-label { margin: 0; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
  html:lang(ko) .sheet-head h2, html:lang(ko) .sheet-label { letter-spacing: 0.04em; font-size: var(--fs-sm); }
  .sheet-nav { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .sheet-nav a {
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
    padding: var(--sp-4) 0; border-bottom: 1px solid var(--line);
    font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.015em; text-decoration: none; color: var(--text-2);
  }
  .sheet-nav a::after { content: ""; width: 6px; height: 6px; border-radius: var(--radius-pill); background: transparent; }
  .sheet-nav a[aria-current="true"] { color: var(--text); }
  .sheet-nav a[aria-current="true"]::after { background: var(--accent); }
  .sheet .contact { display: grid; gap: var(--sp-3); border-top: 0; padding-top: var(--sp-2); }
  .sheet-prefs { margin-top: auto; display: grid; gap: var(--sp-3); padding-top: var(--sp-4); border-top: 1px solid var(--line); }
  .sheet-prefs > div { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-sm); color: var(--text-2); }

  footer { font-size: var(--fs-xs); color: var(--text-3); padding: var(--sp-2) var(--sp-1); }


  /* ---------- 3.1.3 C · Dossier Record (desktop only) ---------- */
  .contact .k, .contact .h, .contact .now, .cv { display: none; }
  @media (min-width: 861px) {
    aside.sidebar { gap: var(--sp-5); }
    .photo { width: var(--sb-photo-w); border-radius: var(--radius-sm); }
    .headline { margin-top: var(--sp-1); }
    .role { display: none; } /* shown as the "Now" row in the record */
    /* key / value record with hairlines */
    .sidebar .contact { gap: 0; padding-top: 0; border-top: 1px solid var(--line-strong); }
    .sidebar .contact li { display: grid; grid-template-columns: var(--sb-key) minmax(0, 1fr); align-items: baseline; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
    .sidebar .contact .now { display: grid; }
    .sidebar .contact .k { display: block; font-size: var(--fs-2xs); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
    html:lang(ko) .sidebar .contact .k { font-size: var(--fs-xs); letter-spacing: 0.02em; }
    .sidebar .contact .v { font-size: var(--fs-sm); color: var(--text); line-height: 1.45; }
    .sidebar .contact a { color: var(--text); }
    .sidebar .contact a:hover { color: var(--accent); }
    .sidebar .contact svg, .contact li:not(.em) .lbl { display: none; }
    .sidebar .contact .h { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar .contact a { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
    .sidebar .contact a:hover { text-decoration-color: var(--accent); }
    .cv {
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3); border: 1px dashed var(--line-strong); border-radius: var(--radius-sm);
      font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); text-decoration: none; cursor: not-allowed;
    }
    .cv .badge { color: var(--text-3); }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    :root { --sidebar: 280px; }
    main { padding: var(--sp-6); }
    .topbar .bar { padding: 0 var(--sp-6); }
    .traj { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: var(--sp-5); }
    .traj li:nth-child(2)::before { right: 0; }
  }
  @media (max-width: 860px) {
    .shell { display: block; }
    aside.sidebar {
      position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line);
      padding: var(--sp-5) var(--sp-4) var(--sp-4);
      display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--sp-2) var(--sp-4); align-items: center;
    }
    .photo { width: 64px; }
    .name { font-size: var(--fs-lg); }
    .headline { font-size: var(--fs-sm); margin-top: 0; }
    .role { font-size: var(--fs-xs); margin-top: 0; }
    :root { --header-h: 52px; }
    .topbar .bar { padding: 0 var(--sp-4); gap: var(--sp-3); }
    /* Tabs scroll sideways; controls stay pinned on the right */
    .tabs { overflow-x: auto; scrollbar-width: none; gap: var(--sp-4); padding-right: var(--sp-5);
      -webkit-mask-image: linear-gradient(to right, var(--mask-solid) calc(100% - 24px), transparent); mask-image: linear-gradient(to right, var(--mask-solid) calc(100% - 24px), transparent); }
    .tabs::-webkit-scrollbar { display: none; }
    /* 3.1.6 C: the bar moves above the profile and holds only identity + menu button */
    .shell { display: flex; flex-direction: column; }
    .col { display: contents; }
    .topbar { order: -1; }
    .topbar nav, .topbar .controls { display: none; }
    .bar-id { text-decoration: none; display: flex; align-items: baseline; gap: var(--sp-2); flex: 1; min-width: 0; white-space: nowrap; }
    .bar-name { font-size: var(--fs-md); font-weight: 600; letter-spacing: -0.01em; }
    .bar-cur { font-size: var(--fs-sm); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; }
    .bar-cur::before { content: "/"; margin-right: var(--sp-2); color: var(--line-strong); }
    .menu-btn, .lang-btn { display: inline-grid; }
    aside.sidebar { padding-top: var(--sp-4); }
    .contact { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); padding-top: var(--sp-3); }
    .contact .lbl { white-space: nowrap; }
    main { padding: var(--sp-4) var(--sp-4) var(--sp-7); }
    .card { padding: var(--sp-5) var(--sp-4); margin-bottom: var(--sp-4); }
    .tagline { font-size: var(--fs-xl); }
  }
  @media (max-width: 560px) {
    .traj { grid-template-columns: minmax(0, 1fr); gap: 0; margin-left: var(--sp-1); }
    .traj li { padding: 0 0 var(--sp-4) var(--sp-5); }
    .traj li::before, .traj li:nth-child(2)::before { top: 4px; bottom: 0; left: 4px; right: auto; width: 1px; height: auto; }
    .traj li:last-child::before { display: none; }
    .skills div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .contact .em .lbl { max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

  /* ===== TYPE ROLES (3.1.1) — typography only: family, weight, tracking, line-height ===== */
  .name, .tagline, .proj h3 { font-family: var(--font-display); }
  .sec-head h2, .sec-head .meta, .traj .yrs, .proj-meta .num, .badge, footer { font-family: var(--font-meta); font-size: var(--fs-xs); letter-spacing: 0; }
  .badge { font-size: var(--fs-2xs); }
  html:lang(ko) .sec-head h2 { font-family: var(--font-ko); }
  body { line-height: var(--lh-body); }
  html:lang(en) body { letter-spacing: var(--ls-body); }
  html:lang(ko) body { line-height: var(--lh-body-ko); letter-spacing: var(--ls-body-ko); }
  .name { font-weight: var(--fw-name); letter-spacing: var(--ls-name); }
  .tagline { font-weight: var(--fw-tagline); line-height: var(--lh-tagline); letter-spacing: var(--ls-tagline); }
  html:lang(ko) .tagline { font-weight: var(--fw-tagline-ko); line-height: var(--lh-tagline-ko); letter-spacing: var(--ls-tagline-ko); }
  .proj h3 { font-weight: var(--fw-title); letter-spacing: var(--ls-title); }
  html:lang(ko) .proj h3 { letter-spacing: var(--ls-title-ko); }
  .traj h3, .skills dt { font-weight: var(--fw-strong); }
  .sec-head h2 { font-weight: var(--fw-eyebrow); letter-spacing: var(--ls-eyebrow); }
  html:lang(ko) .sec-head h2 { font-weight: var(--fw-strong); letter-spacing: var(--ls-eyebrow-ko); }

  /* ===================== ROUND 2 PICKS (3.2.x) ===================== */
  /* 3.2.7 C: monochrome logo under the date (employers only). The <img> keeps the file untouched; tint via filter token. */
  .logo { display: block; width: auto; max-width: var(--logo-w); object-fit: contain; object-position: left center;
        filter: var(--logo-filter); opacity: var(--logo-op); transition: opacity var(--dur) ease; }
  .lg-row .logo { height: calc(var(--logo-h) * var(--s, 1)); margin-top: var(--sp-3); }
  .lg-row.cur .logo, .lg-row:hover .logo { opacity: var(--logo-op-cur); }
  .proj-meta .org { display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0; }
  .proj-meta .logo { display: inline-block; height: calc(var(--logo-h-sm) * var(--s, 1)); opacity: var(--logo-op-cur); }
  @media (max-width: 560px) {
    .lg-row .when-cell { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-2); }
    .lg-row .logo { margin-top: 0; order: -1; height: calc(var(--logo-h) * var(--s, 1) * 0.85); }
  }

  /* ===== 3.2.2 B · Ledger + Selects (inside Selected Work) ===== */
  .pl { margin-top: var(--sp-6); padding-top: var(--sp-5); border-top: 1px solid var(--line-strong); }
  .pl-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-3); }
  .pl-title { margin: 0; font-size: var(--fs-md); font-weight: var(--fw-strong); }
  .pl-title .num { font-family: var(--font-meta); font-size: var(--fs-xs); font-weight: 400; color: var(--text-3); margin-left: var(--sp-1); }
  .pl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); }
  .pl-tools[hidden] { display: none; }
  .sel { position: relative; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface); transition: border-color var(--dur) ease; }
  .sel:hover { border-color: var(--line-strong); }
  .sel:focus-within { border-color: var(--accent); outline: 2px solid var(--focus); outline-offset: 2px; }
  .sel-k { padding-left: var(--sp-3); font-family: var(--font-meta); font-size: var(--fs-2xs); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-3); pointer-events: none; }
  html:lang(ko) .sel-k { font-family: var(--font-ko); font-size: var(--fs-xs); letter-spacing: 0; }
  .sel select {
    appearance: none; -webkit-appearance: none; font: inherit; font-size: var(--fs-sm); color: var(--text); background: none; border: 0; cursor: pointer;
    padding: 5px calc(var(--sp-3) + 14px) 5px var(--sp-2); min-height: 32px; max-width: 220px; text-overflow: ellipsis;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
    background-position: calc(100% - var(--sp-3) - 5px) 55%, calc(100% - var(--sp-3)) 55%; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .sel select:focus-visible { outline: 0; }
  .sel select option { color: var(--text); background: var(--surface); }
  .sel.on { border-color: var(--accent); background: var(--accent-soft); }
  .sel.on select { color: var(--accent); }
  .pl-status { margin: 0 0 var(--sp-2); font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); }
  .pl-status:empty { display: none; }
  .ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .pl-row { position: relative; display: grid; grid-template-columns: calc(var(--sp-8) + var(--sp-5)) minmax(0, 1fr) auto; gap: var(--sp-1) var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
  .pl-row[hidden] { display: none; }
  .pl-y { font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); padding-top: 2px; white-space: nowrap; }
  .pl-t { margin: 0; font-size: var(--fs-sm); font-weight: 500; line-height: 1.45; }
  .pl-who { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--text-3); }
  .pl-cap { margin: 0; font-family: var(--font-meta); font-size: var(--fs-2xs); color: var(--text-3); text-align: right; padding-top: 3px; white-space: nowrap; }
  html:lang(ko) .pl-cap { font-family: var(--font-ko); font-size: var(--fs-xs); }
  .pl-cap b { display: block; font-weight: 500; color: var(--text-2); }
  .badge.f { border-color: var(--accent); color: var(--accent); }
  .pl-none { margin: var(--sp-3) 0 0; font-size: var(--fs-sm); color: var(--text-2); }
  .linkish { font: inherit; font-size: var(--fs-sm); background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 560px) {
    .pl-tools { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
    .sel { width: 100%; }
    .sel select { flex: 1; max-width: none; }
    .pl-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .pl-cap { text-align: left; white-space: normal; padding-top: var(--sp-1); }
    .pl-cap b { display: inline; }
    .pl-cap b::after { content: " · "; color: var(--text-3); font-weight: 400; }
  }


  /* ---------- 3.2.4 B · Index: numbered mono ledger with status filter, links as a right-hand column ---------- */
  .pp-head-link { font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .pp-head-link:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .pidx { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-strong); }
  .pidx > li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: var(--sp-4); padding: var(--sp-4) 0; border-bottom: 1px solid var(--line); }
  .pidx > li[hidden] { display: none; }
  .pidx .n { font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); padding-top: 3px; }
  .pidx .ttl { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-1) var(--sp-3); }
  .pidx h3 { margin: 0; font-size: var(--fs-md); font-weight: var(--fw-strong); line-height: 1.4; }
  .pidx .ttl .st { font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); }
  .pidx .sum { margin: var(--sp-1) 0 0; font-size: var(--fs-sm); color: var(--text-2); max-width: 64ch; }
  .pidx .stk { margin: var(--sp-2) 0 0; font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); }
  .pidx .acts { display: flex; flex-direction: column; gap: var(--sp-2); align-items: stretch; min-width: 112px; }
  .chip-lnk { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 var(--sp-3);
              border: 1px solid var(--line); border-radius: var(--radius-pill); text-decoration: none;
              font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap;
              transition: color var(--dur) ease, border-color var(--dur) ease; }
  .chip-lnk:hover { color: var(--accent); border-color: var(--accent); }
  .chip-lnk svg { width: 13px; height: 13px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }
  @media (max-width: 560px) {
    .pidx > li { grid-template-columns: 28px minmax(0, 1fr); gap: var(--sp-1) var(--sp-3); }
    .pidx .acts { grid-column: 2; flex-direction: row; flex-wrap: wrap; min-width: 0; margin-top: var(--sp-2); }
  }

  /* ===== 3.2.5 dense lists — shared row grammar (tokens only) ===== */
  .ip-list { list-style: none; margin: 0; padding: 0; }
  .it { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: var(--sp-4); padding: var(--sp-3) 0; border-top: 1px solid var(--line); }
  .it .y { font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); padding-top: 2px; }
  .it .tt { display: block; font-size: var(--fs-sm); font-weight: 500; line-height: 1.5; color: var(--text); }
  .it .og { display: block; margin-top: 2px; font-family: var(--font-ko); font-size: var(--fs-xs); line-height: 1.55; color: var(--text-3); word-break: keep-all; }
  .it .au { margin: var(--sp-1) 0 0; font-size: var(--fs-xs); color: var(--text-2); }
  .it .au b { font-weight: var(--fw-strong); color: var(--text); }
  .it .mt { margin: var(--sp-1) 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-xs); color: var(--text-3); }
  .it .mt a { color: var(--accent); font-family: var(--font-meta); text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; overflow-wrap: anywhere; transition: text-decoration-color var(--dur) ease; }
  .it .mt a:hover { text-decoration-color: currentColor; }
  .st.pen::before { border-style: dashed; }
  .sel-mark { font-family: var(--font-meta); font-size: var(--fs-2xs); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
  html:lang(ko) .sel-mark { font-family: var(--font-ko); font-size: var(--fs-xs); letter-spacing: 0; }
  .ip summary { list-style: none; cursor: pointer; }
  .ip summary::-webkit-details-marker { display: none; }
  .chev { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; transition: transform var(--dur) ease; }
  .ip details[open] > summary .chev { transform: rotate(180deg); }
  @media (max-width: 560px) {
    .it { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .ip .sec-head { flex-direction: column; align-items: flex-start; gap: 2px; }
  }

  /* ===== 3.2.5 B · Index drawers: one closed row per type, opens to a year-grouped list ===== */
  .drawers { border-top: 1px solid var(--line-strong); }
  .dr { border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--header-h) + var(--sp-5)); }
  .dr > summary {
    display: grid; grid-template-columns: minmax(0, 1.4fr) 64px minmax(0, 2fr) 96px 20px; align-items: baseline; gap: var(--sp-4);
    padding: var(--sp-4) 0; color: var(--text-2); transition: color var(--dur) ease;
  }
  .dr > summary:hover { color: var(--text); }
  .dr > summary:hover .chev, .dr[open] > summary .chev { color: var(--accent); }
  .dr > summary:focus-visible { outline-offset: -2px; }
  .dr .dn { font-size: var(--fs-lg); font-weight: var(--fw-strong); color: var(--text); letter-spacing: -0.01em; }
  .dr .dc { font-family: var(--font-meta); font-size: var(--fs-xl); font-weight: 500; color: var(--text); text-align: right; line-height: 1; }
  .dr .db { font-size: var(--fs-sm); color: var(--text-2); }
  .dr .dy { font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); text-align: right; }
  .dr .chev { align-self: center; color: var(--text-3); }
  .dr[open] > summary { padding-bottom: var(--sp-2); }
  .dbody { padding: 0 0 var(--sp-5); }
  .yg { list-style: none; margin: 0; padding: 0; }
  .yg > li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: var(--sp-4); border-top: 1px solid var(--line); }
  .yg > li > .yh { margin: 0; padding-top: calc(var(--sp-3) + 2px); font-family: var(--font-meta); font-size: var(--fs-xs); font-weight: 500; color: var(--text-3); }
  html:lang(ko) .yg > li > .yh { font-family: var(--font-ko); }
  .yg .it { grid-template-columns: minmax(0, 1fr); }
  .yg .it:first-child { border-top: 0; }
  @media (max-width: 560px) {
    .dr > summary { grid-template-columns: minmax(0, 1fr) auto 20px; grid-template-areas: "n c v" "b y ."; row-gap: 2px; }
    .dr .dn { grid-area: n; } .dr .dc { grid-area: c; } .dr .chev { grid-area: v; }
    .dr .db { grid-area: b; font-size: var(--fs-xs); } .dr .dy { grid-area: y; white-space: nowrap; }
    .yg > li { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .yg > li > .yh { padding-top: var(--sp-3); }
    .yg .it:first-child { padding-top: var(--sp-1); }
  }

  /* ===== 3.2.6 shared bits ===== */
  .ext { color: inherit; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; transition: text-decoration-color var(--dur) ease, color var(--dur) ease; }
  .ext:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .ext svg { width: 12px; height: 12px; margin-left: 4px; vertical-align: -1px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .dl-list { margin: var(--sp-2) 0 0; padding: 0 0 0 var(--sp-4); font-size: var(--fs-sm); color: var(--text-2); max-width: 68ch; }
  .dl-list li { margin: 2px 0; }
  .dl-list li::marker { color: var(--text-3); }
  .mono { font-family: var(--font-meta); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  @media (max-width: 560px) { #teaching .sec-head { flex-wrap: wrap; row-gap: var(--sp-1); } }

  /* ===== 3.2.6 A · Period Ledger: period | entry, for every section ===== */
  .lg { list-style: none; margin: 0; padding: 0; }
  .lg-group + .lg-group { margin-top: var(--sp-6); }
  .lg-label {
    display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3);
    margin: 0 0 var(--sp-1); padding-bottom: var(--sp-2); border-bottom: 1px solid var(--line-strong);
    font-size: var(--fs-2xs); font-weight: var(--fw-strong); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3);
  }
  html:lang(ko) .lg-label { font-size: var(--fs-xs); letter-spacing: 0.02em; }
  .lg-label .mono { font-weight: 400; }
  .lg-row { display: grid; grid-template-columns: var(--row-when) minmax(0, 1fr); gap: var(--sp-5); padding: var(--sp-4) 0; border-top: 1px solid var(--line); }
  .lg-row:first-child { border-top: 0; }
  .lg > .lg-row:first-child { padding-top: 0; }
  .lg-group .lg-row { padding: var(--sp-3) 0; }
  .lg-when { font-size: var(--fs-xs); color: var(--text-3); padding-top: 3px; }
  .lg-row.cur .lg-when { color: var(--accent); }
  .lg-row h3, .lg-row h4 { margin: 0; font-size: var(--fs-md); font-weight: var(--fw-strong); line-height: 1.4; }
  .lg-group .lg-row h4 { font-size: var(--fs-sm); line-height: 1.5; }
  .lg-sub { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--text-2); }
  #exp-list .lg-sub { color: var(--accent); font-weight: 500; }
  .lg-group .lg-sub { font-size: var(--fs-xs); color: var(--text-3); }
  .lg-desc { margin: var(--sp-2) 0 0; font-size: var(--fs-sm); color: var(--text-2); max-width: 68ch; }
  @media (max-width: 560px) {
    .lg-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .lg-when { padding-top: 0; }
  }

  /* ===================== 3.2.8 Contact + figures (common) ===================== */
  .figs { margin: 0; padding: 0; }
  .fig { display: flex; flex-direction: column; min-width: 0; }
  .fig dt { order: 2; font-size: var(--fs-sm); color: var(--text-2); font-weight: 500; }
  .fig dd { margin: 0; }
  .fig .n { order: 1; font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 500; color: var(--text); line-height: 1.1; letter-spacing: var(--ls-name); }
  .fig .s { order: 3; font-family: var(--font-meta); font-size: var(--fs-2xs); color: var(--text-3); margin-top: 2px; }
  html:lang(ko) .fig .s { font-family: var(--font-ko); font-size: var(--fs-xs); }
  .copy {
    font: inherit; font-size: var(--fs-xs); font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px;
    border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface); color: var(--text-2);
    transition: color var(--dur) ease, border-color var(--dur) ease;
  }
  .copy:hover { color: var(--accent); border-color: var(--line-strong); }
  .copy svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .copy .i-ok { display: none; }
  .copy[data-state="ok"] { color: var(--accent); border-color: var(--accent); }
  .copy[data-state="ok"] .i-copy { display: none; }
  .copy[data-state="ok"] .i-ok { display: inline; }
  .avail { list-style: none; margin: 0; padding: 0; }
  .eyebrow { margin: 0 0 var(--sp-3); font-family: var(--font-meta); font-size: var(--fs-xs); font-weight: 500; letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-3); }
  html:lang(ko) .eyebrow { font-family: var(--font-ko); font-size: var(--fs-sm); font-weight: var(--fw-strong); letter-spacing: var(--ls-eyebrow-ko); }
  .links { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); margin: 0; padding: 0; list-style: none; }
  .links a { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--text-2); text-decoration: none; }
  .links a:hover { color: var(--accent); }
  .links svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }

  /* A: hairline ledger of 4 figures under the trajectory; Contact in two columns */
  .figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: var(--sp-6); border-top: 1px solid var(--line); }
  .fig { padding: var(--sp-4) var(--sp-4) 0; border-left: 1px solid var(--line); }
  .fig:first-child { border-left: 0; padding-left: 0; }
  .fig .n { font-size: var(--fs-2xl); }
  .figs + .skills { margin-top: var(--sp-5); }
  .ct { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--sp-7); }
  .avail { counter-reset: av; border-top: 1px solid var(--line); }
  .avail li { counter-increment: av; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--sp-2); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--text); }
  .avail li::before { content: counter(av, decimal-leading-zero); font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-3); padding-top: 2px; }
  .reach { border-top: 1px solid var(--line); padding-top: var(--sp-4); display: grid; gap: var(--sp-4); align-content: start; }
  .mail { font-size: var(--fs-lg); font-weight: 500; color: var(--accent); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; overflow-wrap: anywhere; }
  .mail:hover { text-decoration-color: var(--accent); }
  .mail-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); }
  .links { flex-direction: column; gap: var(--sp-2); }
  @media (max-width: 860px) { .ct { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); } }
  @media (max-width: 560px) {
    .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fig:nth-child(odd) { border-left: 0; padding-left: 0; }
    .fig:nth-child(n+3) { border-top: 1px solid var(--line); margin-top: var(--sp-4); }
    .fig .n { font-size: var(--fs-xl); }
  }
  /* ===== 3.3.1 MOTION LAYER ===== */
  /* Swaps (theme/lang) never let individual colour transitions run mid-swap. */
  .m-notx, .m-notx *, .m-notx *::before, .m-notx *::after { transition: none !important; }
  /* draft-only replay control */
  .m-replay { position: fixed; left: var(--sp-3); bottom: var(--sp-3); z-index: 60; display: inline-flex; align-items: center; gap: var(--sp-2);
    font: inherit; font-family: var(--font-meta); font-size: var(--fs-xs); color: var(--text-2); background: var(--surface);
    border: 1px dashed var(--line-strong); border-radius: var(--radius-pill); padding: 6px 12px; cursor: pointer; }
  .m-replay:hover { color: var(--accent); }
  .m-replay:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (prefers-reduced-motion: no-preference) {
    @view-transition { navigation: auto; } /* site: /  <->  /ko/ cross-fade */
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: var(--m-lang); }
    html[data-vt="theme"]::view-transition-old(root), html[data-vt="theme"]::view-transition-new(root) { animation-duration: var(--m-theme); }
  }
  /* Entrance: only sections that start below the fold get .m-wait (set by JS), so
     nothing visible is ever hidden and no-JS pages render complete. */
  .m-wait { opacity: 0; transform: translateY(var(--m-rise)); }
  .m-wait.m-in { opacity: 1; transform: none; transition: opacity var(--m-reveal) var(--ease-out), transform var(--m-reveal) var(--ease-out); }
  /* Sliding tab underline (one indicator instead of per-tab grow) */
  .m-slide .tabs { position: relative; }
  .m-slide .tabs a::after { display: none; }
  .m-ind { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; border-radius: 2px; background: var(--accent); pointer-events: none; opacity: 0; }
  .m-ind.m-on { transition: transform var(--m-nav) var(--ease-out), width var(--m-nav) var(--ease-out), opacity var(--dur) ease; }
  @media (hover: hover) {
    .proj:has(h3 a) { transition: background-color var(--dur) ease, box-shadow var(--dur) ease; }
    .proj:has(h3 a):hover { background: var(--row-tint); box-shadow: calc(-1 * var(--sp-3)) 0 0 var(--row-tint), var(--sp-3) 0 0 var(--row-tint); }
  }
  @media print { .m-wait { opacity: 1 !important; transform: none !important; } .m-replay { display: none; } }
</style>

    if (x.s) m.push('<span class="st' + (x.s === 'registered' ? ' reg' : x.s === 'filed' ? '' : ' pen') + '">' + u(x.s) + '</span>');
    if (p.venue) m.push('<span>' + esc(t(p.venue)) + '</span>');
    if (p.publisher) m.push('<span>' + esc(t(p.publisher)) + '</span>');
    if (p.doi) m.push('<a href="https://doi.org/' + esc(p.doi) + '" rel="noopener">DOI ' + esc(p.doi) + '</a>');
    if (x.f) m.push('<span class="sel-mark">' + u('selected') + '</span>');
    var og = L === 'en' && p.title.ko && p.title.ko !== p.title.en ? '<span class="og" lang="ko">' + esc(p.title.ko) + '</span>' : '';
    var au = p.authors ? '<p class="au">' + esc(p.authors).replace(/K\.(?:[ -]M\.)? Yu/, '<b>$&</b>') + '</p>' : '';
    return '<li class="it"><div><span class="tt">' + esc(t(p.title)) + '</span>' + og + au +
      (m.length ? '<p class="mt">' + m.join('') + '</p>' : '') + '</div></li>';
  }
  function renderPatents() {
    // Keep open drawers across a language re-render.
    var keep = Array.prototype.map.call(document.querySelectorAll('#ip details[open]'), function (d) { return d.dataset.id; });
    var D = ipData(), K = ['pat', 'sw', 'paper', 'report'];
    var total = K.reduce(function (s, k) { return s + D[k].length; }, 0);
    document.getElementById('pat-meta').textContent = L === 'ko' ? '총 ' + total + '건' : total + ' records';
    function byYear(xs) {
      var g = [];
      xs.forEach(function (x) { var y = yearOf(x) || u('pending'); var last = g[g.length - 1]; if (last && last.y === y) last.xs.push(x); else g.push({ y: y, xs: [x] }); });
      return '<ol class="yg">' + g.map(function (b) { return '<li><h4 class="yh">' + b.y + '</h4><ol class="ip-list">' + b.xs.map(item).join('') + '</ol></li>'; }).join('') + '</ol>';
    }
    // Native <details>: folds without JS, Enter/Space toggles, expanded state is announced.
    document.getElementById('ip').innerHTML = '<div class="drawers">' + K.map(function (k) {
      return '<details class="dr" id="ip-' + k + '" data-id="' + k + '"' + (keep.indexOf(k) > -1 ? ' open' : '') + '><summary>' +
        '<span class="dn">' + u(k) + '</span><span class="dc">' + D[k].length + '</span>' +
        '<span class="db">' + breakdown(k, D[k]) + '</span><span class="dy">' + yearSpan(D[k]) + '</span>' + CHEV +
        '</summary><div class="dbody">' + byYear(D[k]) + '</div></details>';
    }).join('') + '</div>';
  }

  // ===== 3.2.8 A · Figures (counted from content, nothing typed by hand) + two-column Contact =====
  var FIGS = ['projects', 'patents', 'software', 'books'];
  function figures() {
    var v = function (o) { return Object.values(o); };
    var n = function (a, f) { return a.filter(f).length; };
    var pat = v(C.patents), sw = v(C.software), prj = v(C.projects);
    var pr = n(pat, function (p) { return p.status === 'registered'; }), sr = n(sw, function (p) { return p.status === 'registered'; });
    var fe = n(prj, function (p) { return p.featured; }), ko = L === 'ko';
    return {
      projects: { n: prj.length, s: ko ? '대표 ' + fe + '건' : fe + ' ' + u('s_featured') },
      patents: { n: pat.length, s: ko ? '등록 ' + pr + ' · 출원 ' + (pat.length - pr) : pr + ' registered · ' + (pat.length - pr) + ' filed' },
      software: { n: sw.length, s: ko ? '등록 ' + sr + ' · 진행 중 ' + (sw.length - sr) : sr + ' registered · ' + (sw.length - sr) + ' pending' },
      books: { n: n(v(C.teaching), function (p) { return p.kind === 'book'; }), s: '' }
    };
  }
  function renderContact() {
    var F = figures(), c = C.profile.contact;
    document.querySelectorAll('.figs').forEach(function (dl) {
      dl.setAttribute('aria-label', u('figures'));
      dl.innerHTML = FIGS.map(function (k) {
        return '<div class="fig"><dt>' + u('f_' + k) + '</dt><dd class="n">' + F[k].n + '</dd>' + (F[k].s ? '<dd class="s">' + esc(F[k].s) + '</dd>' : '') + '</div>';
      }).join('');
    });
    document.querySelectorAll('[data-avail]').forEach(function (ul) {
      ul.innerHTML = C.profile.availability.map(function (a) { return '<li>' + esc(t(a)) + '</li>'; }).join('');
    });
    document.querySelectorAll('[data-mail]').forEach(function (a) { a.href = 'mailto:' + c.email; a.textContent = c.email; });
    document.querySelectorAll('[data-links]').forEach(function (ul) {
      ul.innerHTML = '<li><a href="' + esc(c.github) + '" rel="noopener">' + ICON.gh + '<span>GitHub</span></a></li>' +
        '<li><a href="' + esc(c.linkedin) + '" rel="noopener">' + ICON.in + '<span>LinkedIn</span></a></li>';
    });
    document.querySelectorAll('.copy').forEach(function (b) { b.setAttribute('aria-label', u('copyEmail') + ': ' + c.email); });
  }
  function copyEmail(b) {
    var e = C.profile.contact.email;
    var done = function () {
      b.dataset.state = 'ok'; b.querySelector('.copy-l').textContent = u('copied');
      document.getElementById('copy-status').textContent = u('copiedLong');
      clearTimeout(b._t); b._t = setTimeout(function () { delete b.dataset.state; b.querySelector('.copy-l').textContent = u('copy'); document.getElementById('copy-status').textContent = ''; }, 1800);
    };
    var legacy = function () { // file:// or older browsers without the async clipboard
      var ta = document.createElement('textarea'); ta.value = e; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} document.body.removeChild(ta); b.focus(); done();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(e).then(done, legacy); else legacy();
  }

  function setParam(k, v) {
    var q = new URLSearchParams(location.search); q.set(k, v);
    history.replaceState(null, '', '?' + q.toString() + location.hash);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.lang || b.id === 'lang-btn') { var lg = b.dataset.lang || (L === 'en' ? 'ko' : 'en'); mSwap('lang', function () { root.lang = lg; setParam('lang', lg); render(); }); }
    else if (b.id === 'theme' || b.classList.contains('theme-btn')) { var th = root.dataset.theme === 'dark' ? 'light' : 'dark'; mSwap('theme', function () { root.dataset.theme = th; setParam('theme', th); }); }
    else if (b.dataset.pf) { ppFilter = b.dataset.pf; ppOpen = false; renderPersonal(); b = document.querySelector('[data-pf="' + ppFilter + '"]'); b && b.focus(); }
    else if (b.id === 'pp-toggle') { ppOpen = !ppOpen; renderPersonal(); }
    else if (b.classList.contains('copy')) { copyEmail(b); }
  });

  // Underline the tab of the section in view. Tabs are static markup (only labels are
  // re-rendered on language switch), so the current state survives a language change.
  function setCurrent(id) {
    var bar = document.getElementById('tabs');
    var cur = document.getElementById('bar-cur');
    cur.dataset.ui = id; cur.textContent = u(cur.dataset.ui);
    document.querySelectorAll('.sheet-nav a').forEach(function (a) { a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + id)); });
    bar.querySelectorAll('a').forEach(function (a) {
      var on = a.getAttribute('href') === '#' + id;
      a.setAttribute('aria-current', String(on));
      // Keep the current tab visible in a scrolling tab bar.
      if (on && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = a.offsetLeft - bar.offsetLeft - 16;
    });
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) setCurrent(en.target.id); });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('main section').forEach(function (s) { io.observe(s); });
  }
  // The last section is short, so it may never cross the observer band: mark it at page end.
  addEventListener('scroll', function () { if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) setCurrent('contact'); }, { passive: true });

  // 3.1.6 C: menu sheet open/close; native <dialog> handles focus containment and Esc.
  var sheet = document.getElementById('sheet'), menuBtn = document.getElementById('menu-btn');
  menuBtn.addEventListener('click', function () { sheet.showModal(); menuBtn.setAttribute('aria-expanded', 'true'); });
  sheet.addEventListener('close', function () { menuBtn.setAttribute('aria-expanded', 'false'); });
  sheet.addEventListener('click', function (e) {
    // target === sheet only on the backdrop, since .sheet-in fills the dialog box
    if (e.target === sheet || e.target.closest('#sheet-close, .sheet-nav a')) sheet.close();
  });

  renderStatic();
  render();
})();
</script>
<script>
// ===== 3.3.1 B · motion layer =====
(function () {
  var R = document.documentElement;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var VT = !reduce && !!document.startViewTransition;
  // Theme/language swap: one instant change (A) or one cross-fade of the whole page (B/C).
  window.mSwap = function (kind, fn) {
    var go = function () { R.classList.add('m-notx'); fn(); void R.offsetWidth; };
    var done = function () { delete R.dataset.vt; requestAnimationFrame(function () { R.classList.remove('m-notx'); }); };
    if (!VT) { go(); done(); return; }
    R.dataset.vt = kind;
    document.startViewTransition(go).finished.then(done, done);
  };
  // Draft-only: replay = back to top and reload, so first-view effects run again.
  var rp = document.createElement('button');
  rp.type = 'button'; rp.className = 'm-replay'; rp.textContent = '\u21bb Replay (draft)';
  rp.addEventListener('click', function () { scrollTo(0, 0); location.reload(); });
  document.body.appendChild(rp);

  if (reduce) return; // reduced motion: no entrance, no slide, no count; swaps are instant (VT off)

  // Sliding tab underline: follows aria-current set by the scroll-spy.
  var tabs = document.getElementById('tabs');
  var ind = document.createElement('li');
  ind.className = 'm-ind'; ind.setAttribute('aria-hidden', 'true');
  tabs.appendChild(ind); R.classList.add('m-slide');
  function place() {
    var a = tabs.querySelector('a[aria-current="true"]');
    if (!a || !a.offsetWidth) { ind.style.opacity = 0; return; }
    ind.style.opacity = 1; ind.style.width = a.offsetWidth + 'px'; ind.style.transform = 'translateX(' + a.offsetLeft + 'px)';
  }
  new MutationObserver(place).observe(tabs, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['aria-current'] });
  addEventListener('resize', place);
  place(); document.fonts && document.fonts.ready.then(place);
  requestAnimationFrame(function () { ind.classList.add('m-on'); });

  if (!('IntersectionObserver' in window)) return;
  // Entrance, once per section. Sections already on screen at load are left alone.
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      io.unobserve(e.target); e.target.classList.add('m-in');
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('main > section.card').forEach(function (s) {
    if (s.getBoundingClientRect().top < innerHeight) return;
    s.classList.add('m-wait'); io.observe(s);
  });
})();
</script>
