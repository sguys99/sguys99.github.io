<style>
  /* =====================================================================
     TOKENS — G4 base (round-1 + round-2 picks merged). Round-3 drafts copy this
     file; this block later becomes src/styles/tokens.css.
     Everything below "BASE" uses these variables; no raw colors/fonts there.
     Picks: 3.1.1 A type · 3.1.2 A Slate Ink · 3.1.3 C sidebar · 3.1.6 C mobile ·
     3.2.1 A · 3.2.2 B · 3.2.4 B · 3.2.5 B · 3.2.6 A · 3.2.7 C · 3.2.8 A.
     ===================================================================== */
  :root {
    /* --- font families (3.1.1 A: Geist + Geist Mono, Pretendard for Hangul) --- */
    --font: "Geist", "Pretendard Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-ko: "Pretendard Variable", "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --font-display: var(--font);
    --font-meta: "Geist Mono", "Pretendard Variable", ui-monospace, "SFMono-Regular", monospace;

    /* --- type scale (px @16): 11 / 12 / 13 / 15 / 17 / 22 / 30 --- */
    --fs-2xs: 0.6875rem;
    --fs-xs: 0.75rem;
    --fs-sm: 0.8125rem;
    --fs-md: 0.9375rem;
    --fs-lg: 1.0625rem;
    --fs-xl: 1.375rem;
    --fs-2xl: 1.875rem;
    --fw-name: 600; --fw-tagline: 500; --fw-tagline-ko: 600; --fw-title: 600; --fw-strong: 600; --fw-eyebrow: 500;
    --lh-body: 1.6; --lh-body-ko: 1.75; --lh-tagline: 1.22; --lh-tagline-ko: 1.4;
    --ls-body: -0.005em; --ls-body-ko: -0.01em; --ls-name: -0.02em; --ls-tagline: -0.03em; --ls-tagline-ko: -0.035em;
    --ls-title: -0.012em; --ls-title-ko: -0.02em; --ls-eyebrow: 0.06em; --ls-eyebrow-ko: 0;

    /* --- color: light (3.1.2 A Slate Ink) --- */
    color-scheme: light;
    --bg: #f3f5f8;
    --surface: #ffffff;
    --line: #dfe3ea;
    --line-strong: #c5ccd6;
    --text: #141a22;
    --text-2: #475260;
    --text-3: #5f6a78;
    --chip: #eef1f5;
    --header-bg: rgba(243, 245, 248, 0.9);
    --scrim: rgba(22, 25, 29, 0.32);
    --photo-ring: var(--line);
    --photo-filter: none;
    --accent: #2b5a8a;
    --accent-soft: #e6edf6;
    --focus: var(--accent);

    /* --- radius --- */
    --radius: 10px;
    --radius-sm: 6px;
    --radius-xs: 4px;
    --radius-pill: 999px;

    /* --- spacing --- */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

    /* --- layout --- */
    --sidebar: 320px;
    --main: 960px;
    --header-h: 56px;
    --sb-photo-w: 132px; /* 3.1.3 C sidebar photo */
    --sb-key: 64px;      /* 3.1.3 C key column */
    --sheet-w: 340px;    /* 3.1.6 C mobile menu sheet */
    --row-when: 148px;   /* 3.2.6 A period column */
    --logo-h: 22px;      /* 3.2.7 C logo box height (scaled per logo by --s) */
    --logo-w: 124px;     /* 3.2.7 C max logo width (fits the date column) */
    --logo-h-sm: 14px;   /* 3.2.7 C logo in project meta */
    --logo-filter: brightness(0);  /* official artwork -> one ink */
    --logo-op: 0.62;               /* resting ink weight (reads near --text-3) */
    --logo-op-cur: 0.92;           /* current employer */

    /* --- motion --- */
    --dur: 180ms;

    --mask-solid: #000; /* mask alpha only, not a visible color */
  }
  html:lang(ko) { --font-display: var(--font-ko); }

  /* --- color: dark (3.1.2 A Slate Ink). Same values in both blocks below:
         OS preference when no explicit light choice, and explicit [data-theme=dark]. --- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #151b23;
      --line: #252d38;
      --line-strong: #364150;
      --text: #e6eaf0;
      --text-2: #b1bac6;
      --text-3: #8b95a3;
      --chip: #1d2530;
      --header-bg: rgba(13, 17, 23, 0.9);
      --scrim: rgba(0, 0, 0, 0.6);
      --photo-ring: var(--line-strong);
      --photo-filter: brightness(0.86); /* tone down the white photo backdrop on dark */
      --accent: #8db3e2;
      --accent-soft: #1a283b;
      --logo-filter: brightness(0) invert(1);
      --logo-op: 0.6;
      --logo-op-cur: 0.9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #151b23;
    --line: #252d38;
    --line-strong: #364150;
    --text: #e6eaf0;
    --text-2: #b1bac6;
    --text-3: #8b95a3;
    --chip: #1d2530;
    --header-bg: rgba(13, 17, 23, 0.9);
    --scrim: rgba(0, 0, 0, 0.6);
    --photo-ring: var(--line-strong);
    --photo-filter: brightness(0.86);
    --accent: #8db3e2;
    --accent-soft: #1a283b;
    --logo-filter: brightness(0) invert(1);
    --logo-op: 0.6;
    --logo-op-cur: 0.9;
  }
  /* ============================ BASE ============================ */

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: var(--fs-md);
    line-height: 1.6;
    font-feature-settings: "tnum" 0;
    -webkit-font-smoothing: antialiased;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }
  :lang(ko) body, :lang(ko) { font-family: var(--font-ko); }
  html:lang(ko) body { line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -0.005em; }
  html:lang(en) body { letter-spacing: -0.003em; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-xs); }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

  /* ---------- Layout ---------- */
  /* Centered on wide screens (from A2): sidebar + main share one column; the top menu lives inside it. */
  .shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; max-width: calc(var(--sidebar) + var(--main)); margin: 0 auto; }
  aside.sidebar {
    position: sticky; top: 0; height: 100vh;
    border-right: 1px solid var(--line);
    padding: var(--sp-7) var(--sp-6);
    display: flex; flex-direction: column; gap: var(--sp-5);
    overflow-y: auto;
  }
  .col { min-width: 0; }
  main { padding: var(--sp-6) var(--sp-7) var(--sp-8); max-width: var(--main); width: 100%; }

  /* ---------- Top menu (sticky, right column) ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg);
    -webkit-backdrop-filter: saturate(1.2) blur(8px); backdrop-filter: saturate(1.2) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .bar {
    max-width: var(--main); height: var(--header-h); padding: 0 var(--sp-7);
    display: flex; align-items: center; gap: var(--sp-4);
  }
  .topbar nav { flex: 1; min-width: 0; align-self: stretch; display: flex; }
  .tabs { display: flex; gap: var(--sp-5); margin: 0; padding: 0; list-style: none; }
  .tabs li { display: flex; }
  .tabs a {
    position: relative; display: flex; align-items: center; white-space: nowrap;
    font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); text-decoration: none;
    transition: color var(--dur) ease;
  }
  .tabs a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px;
    background: var(--accent); transform: scaleX(0); transition: transform var(--dur) ease;
  }
  .tabs a:hover { color: var(--text); }
  .tabs a[aria-current="true"] { color: var(--text); }
  .tabs a[aria-current="true"]::after { transform: scaleX(1); }
  .tabs a:focus-visible { outline-offset: -2px; }

  /* ---------- Sidebar ---------- */
  .photo {
    width: 112px; height: auto; aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: var(--radius); border: 1px solid var(--photo-ring);
    background: var(--chip); display: block; filter: var(--photo-filter);
  }
  .name { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.25; }
  .headline { margin: var(--sp-1) 0 0; color: var(--accent); font-weight: 500; font-size: var(--fs-md); }
  .role { margin: var(--sp-1) 0 0; color: var(--text-2); font-size: var(--fs-sm); }
  .contact { list-style: none; margin: 0; padding: var(--sp-4) 0 0; border-top: 1px solid var(--line); display: grid; gap: var(--sp-2); }
  .contact a {
    display: flex; align-items: center; gap: var(--sp-3);
    text-decoration: none; color: var(--text-2); font-size: var(--fs-sm);
    transition: color var(--dur) ease;
  }
  .contact a:hover { color: var(--accent); }
  .contact svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .contact .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .controls { display: flex; gap: var(--sp-2); align-items: center; flex: none; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 2px; background: var(--surface); }
  .seg button {
    font: inherit; font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.02em;
    border: 0; background: none; color: var(--text-3); cursor: pointer;
    padding: 4px 10px; border-radius: var(--radius-pill); min-height: 28px;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .icon-btn {
    display: inline-grid; place-items: center; width: 34px; height: 34px;
    border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface);
    color: var(--text-2); cursor: pointer; transition: color var(--dur) ease, border-color var(--dur) ease;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--line-strong); }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  [data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }

  /* ---------- Cards / sections ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--sp-6); margin-bottom: var(--sp-5);
    scroll-margin-top: calc(var(--header-h) + var(--sp-5));
  }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-5); }
  .sec-head h2 {
    margin: 0; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3);
  }
  html:lang(ko) .sec-head h2 { letter-spacing: 0.04em; font-size: var(--fs-sm); }
  .sec-head .meta { font-size: var(--fs-xs); color: var(--text-3); }

  /* About */
  .tagline { margin: 0 0 var(--sp-4); font-size: var(--fs-2xl); line-height: 1.3; font-weight: 500; letter-spacing: -0.02em; max-width: 30ch; }
  html:lang(ko) .tagline { line-height: 1.45; letter-spacing: -0.03em; max-width: 24ch; }
  .tagline { text-wrap: balance; }
  .about { margin: 0; color: var(--text-2); max-width: 68ch; }

  .traj { list-style: none; margin: var(--sp-6) 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-4); }
  .traj li { position: relative; padding-top: var(--sp-5); }
  .traj li::before { content: ""; position: absolute; top: 4px; left: 0; right: calc(-1 * var(--sp-4)); height: 1px; background: var(--line-strong); }
  .traj li:last-child::before { right: 0; background: linear-gradient(to right, var(--accent), transparent); }
  .traj li::after { content: ""; position: absolute; top: 0; left: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line-strong); }
  .traj li:last-child::after { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .traj .yrs { font-size: var(--fs-xs); color: var(--text-3); }
  .traj h3 { margin: 2px 0 var(--sp-1); font-size: var(--fs-md); font-weight: 600; line-height: 1.35; }
  .traj li:last-child h3 { color: var(--accent); }
  .traj p { margin: 0; font-size: var(--fs-sm); color: var(--text-2); line-height: 1.55; }

  .skills { margin: var(--sp-6) 0 0; padding: 0; border-top: 1px solid var(--line); }
  .skills div { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
  .skills div:last-child { border-bottom: 0; padding-bottom: 0; }
  .skills dt { font-size: var(--fs-sm); font-weight: 600; }
  .skills dd { margin: 0; font-size: var(--fs-sm); color: var(--text-2); }

  /* Selected Work */
  .work { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
  .proj {
    display: flex; flex-direction: column; gap: var(--sp-3);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--sp-5);
    transition: border-color var(--dur) ease;
  }
  .proj:hover { border-color: var(--line-strong); }
  .proj-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-xs); color: var(--text-3); }
  .proj-meta .org { color: var(--text-2); font-weight: 500; }
  .proj h3 { margin: 0; font-size: var(--fs-lg); font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
  html:lang(ko) .proj h3 { letter-spacing: -0.02em; }
  .proj p { margin: 0; font-size: var(--fs-sm); color: var(--text-2); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tag { font-size: var(--fs-xs); padding: 2px 8px; border-radius: var(--radius-pill); background: var(--chip); color: var(--text-2); line-height: 1.6; }
  .tag.k { background: var(--accent-soft); color: var(--accent); }
  .stack { font-size: var(--fs-xs); color: var(--text-3); margin: 0; }
  .more {
    margin-top: auto; padding-top: var(--sp-2); align-self: flex-start;
    font-size: var(--fs-sm); font-weight: 500; color: var(--accent); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .more svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; transition: transform var(--dur) ease; }
  .more:hover svg { transform: translateX(3px); }
  .badge { font-size: var(--fs-2xs); font-weight: 500; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--radius-xs); color: var(--text-2); }

  /* Rows (experience, patents) — same grammar: date | title / sub / meta */
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--sp-5); padding: var(--sp-4) 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 0; }
  .row .when { font-size: var(--fs-sm); color: var(--text-3); padding-top: 1px; }
  .row h3 { margin: 0; font-size: var(--fs-md); font-weight: 600; line-height: 1.4; }
  .row .sub { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--accent); font-weight: 500; }
  .row .desc { margin: var(--sp-2) 0 0; font-size: var(--fs-sm); color: var(--text-2); max-width: 68ch; }
  .row.current .when { color: var(--accent); }

  .filters { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .pat .row { grid-template-columns: 100px minmax(0, 1fr); padding: var(--sp-3) 0; }
  .pat h3 { font-weight: 500; font-size: var(--fs-sm); line-height: 1.5; }
  .pat .pm { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--text-3); display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
  .st { display: inline-flex; align-items: center; gap: 5px; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--text-3); }
  .st.reg::before { background: var(--accent); border-color: var(--accent); }
  .st.reg { color: var(--text-2); }
  .toggle-all {
    margin-top: var(--sp-4); font: inherit; font-size: var(--fs-sm); font-weight: 500;
    background: none; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 6px 14px;
    color: var(--text-2); cursor: pointer; transition: border-color var(--dur) ease, color var(--dur) ease;
  }
  .toggle-all:hover { color: var(--accent); border-color: var(--line-strong); }
  .pat .row[hidden] { display: none; }

  /* 3.1.6 C: slim bar identity + menu button (mobile only) and the menu sheet */
  .bar-id, .menu-btn, .lang-btn { display: none; }
  .lang-btn { width: auto; padding: 0 var(--sp-3); font: inherit; font-family: var(--font-meta); font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.02em; }
  .sheet {
    margin: 0 0 0 auto; padding: 0; border: 0; border-left: 1px solid var(--line);
    width: min(var(--sheet-w), 88vw); height: 100dvh; max-width: none; max-height: none;
    background: var(--surface); color: var(--text);
  }
  .sheet::backdrop { background: var(--scrim); }
  .sheet[open] { animation: sheet-in var(--dur) ease-out; }
  .sheet[open]::backdrop { animation: fade-in var(--dur) ease-out; }
  @keyframes sheet-in { from { transform: translateX(24px); opacity: 0; } }
  @keyframes fade-in { from { opacity: 0; } }
  .sheet-in { min-height: 100%; display: flex; flex-direction: column; gap: var(--sp-6); padding: var(--sp-3) var(--sp-5) var(--sp-6); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; height: var(--header-h); }
  .sheet-head h2, .sheet-label { margin: 0; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
  html:lang(ko) .sheet-head h2, html:lang(ko) .sheet-label { letter-spacing: 0.04em; font-size: var(--fs-sm); }
  .sheet-nav { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .sheet-nav a {
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
    padding: var(--sp-4) 0; border-bottom: 1px solid var(--line);
    font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.015em; text-decoration: none; color: var(--text-2);
  }
  .sheet-nav a::after { content: ""; width: 6px; height: 6px; border-radius: var(--radius-pill); background: transparent; }
  .sheet-nav a[aria-current="true"] { color: var(--text); }
  .sheet-nav a[aria-current="true"]::after { background: var(--accent); }
  .sheet .contact { display: grid; gap: var(--sp-3); border-top: 0; padding-top: var(--sp-2); }
  .sheet-prefs { margin-top: auto; display: grid; gap: var(--sp-3); padding-top: var(--sp-4); border-top: 1px solid var(--line); }
  .sheet-prefs > div { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-sm); color: var(--text-2); }

  footer { font-size: var(--fs-xs); color: var(--text-3); padding: var(--sp-2) var(--sp-1); }


  /* ---------- 3.1.3 C · Dossier Record (desktop only) ---------- */
  .contact .k, .contact .h, .contact .now, .cv { display: none; }
  @media (min-width: 861px) {
    aside.sidebar { gap: var(--sp-5); }
    .photo { width: var(--sb-photo-w); border-radius: var(--radius-sm); }
    .headline { margin-top: var(--sp-1); }
    .role { display: none; } /* shown as the "Now" row in the record */
    /* key / value record with hairlines */
    .sidebar .contact { gap: 0; padding-top: 0; border-top: 1px solid var(--line-strong); }
    .sidebar .contact li { display: grid; grid-template-columns: var(--sb-key) minmax(0, 1fr); align-items: baseline; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
    .sidebar .contact .now { display: grid; }

    tradeoff: { en: 'Trade-off', ko: '트레이드오프' },
    stack: { en: 'Stack', ko: '기술 스택' },
    outcome: { en: 'Outcome', ko: '성과' },
    client: { en: 'Client', ko: '고객' },
    org: { en: 'Organization', ko: '소속' },
    period: { en: 'Period', ko: '기간' },
    roleK: { en: 'Role', ko: '역할' },
    domain: { en: 'Domain', ko: '분야' },
    lead: { en: 'Lead', ko: '총괄' },
    present: { en: 'Present', ko: '현재' },
    planned: { en: 'Planned', ko: '예정' },
    inProgress: { en: 'In progress', ko: '진행 중' },
    cs: { en: 'Case study', ko: '케이스 스터디' },
    work: { en: 'Selected Work', ko: '대표 프로젝트' },
    allWork: { en: 'All selected work', ko: '대표 프로젝트 전체' },
    prev: { en: 'Previous', ko: '이전' },
    next: { en: 'Next', ko: '다음' },
    onPage: { en: 'On this page', ko: '이 페이지' },
    archNote: { en: 'Conceptual diagram', ko: '개념도' },
    flows: { en: 'Flows', ko: '흐름' },
    layer: { en: 'Layer', ko: '계층' },
    parts: { en: 'Components', ko: '구성 요소' },
    facts: { en: 'Project facts', ko: '프로젝트 정보' },
    pager: { en: 'Case studies', ko: '케이스 스터디 목록' },
    about: { en: 'About', ko: '소개' },
    experience: { en: 'Experience', ko: '경력' },
    patents: { en: 'Patents', ko: '특허' },
    theme: { en: 'Toggle dark mode', ko: '다크 모드 전환' },
    cv: { en: 'Download CV', ko: 'CV 다운로드' },
    ph: { en: 'Placeholder', ko: '자리 표시' },
    now: { en: 'Now', ko: '현재' },
    email: { en: 'Email', ko: '이메일' },
    menu: { en: 'Menu', ko: '메뉴' },
    openMenu: { en: 'Open menu', ko: '메뉴 열기' },
    closeMenu: { en: 'Close menu', ko: '메뉴 닫기' },
    language: { en: 'Language', ko: '언어' },
    themeL: { en: 'Theme', ko: '테마' },
    sections: { en: 'Sections', ko: '섹션' },
    otherLang: { en: 'KO', ko: 'EN' },
    switchLang: { en: '한국어로 보기', ko: 'View in English' },
    // 3.3.2 A (same labels as the home page)2: six tabs; Experience also covers Teaching and Awards & Education (data-for in the markup).
    tab_about: { en: 'About', ko: '소개' },
    tab_work: { en: 'Work', ko: '대표 프로젝트' },
    tab_personal: { en: 'Personal', ko: '개인 프로젝트' },
    tab_experience: { en: 'Experience', ko: '경력' },
    tab_ip: { en: 'Publications', ko: '지식재산 · 출판물' },
    tab_contact: { en: 'Contact', ko: '연락처' }
  };
  var t = function (o) { return o == null ? '' : (typeof o === 'string' ? o : (o[L] || o.en || '')); };
  var u = function (k) { return UI[k][L]; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var get = function (path) { return path.split('.').reduce(function (o, k) { return o && o[k]; }, C); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function ym(s) {
    if (!s) return '';
    var p = s.split('-');
    return L === 'ko' ? p[0] + '.' + p[1] : MON[+p[1] - 1] + ' ' + p[0];
  }
  function period(p) { return ym(p.start) + ' – ' + (p.status === 'present' ? u('present') : ym(p.end)); }

  var ICON = {
    mail: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    gh: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>',
    in: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>'
  };

  // ---- which case study (draft: ?slug=<id>; site: /work/<slug>/) ----
  // Pager order = featured `order`, only entries that have a caseStudy.
  var LIST = Object.keys(C.projects).filter(function (k) { return C.projects[k].featured && C.projects[k].caseStudy; })
    .sort(function (a, b) { return C.projects[a].order - C.projects[b].order; });
  var q0 = new URLSearchParams(location.search).get('slug');
  var SLUG = LIST.indexOf(q0) >= 0 ? q0 : 'samsung-scm-agent';
  var P = C.projects[SLUG], CS = P.caseStudy, IDX = LIST.indexOf(SLUG);
  var ONGOING = P.period.status === 'present' || P.period.status === 'planned';

  function caseHref(s) { var p = new URLSearchParams(location.search); p.set('slug', s); return '?' + p.toString(); }
  function homeHref(hash) { var p = new URLSearchParams(location.search); p.delete('slug'); var s = p.toString(); return '332-a2.html' + (s ? '?' + s : '') + (hash || '#work'); }
  function bl(arr, cls) { return '<ul class="bl' + (cls ? ' ' + cls : '') + '">' + arr.map(function (b) { return '<li>' + esc(t(b)) + '</li>'; }).join('') + '</ul>'; }
  function clientName() { return P.client ? t(P.client.public ? P.client.name : P.client.label) : ''; }
  // Role is shown only as the Lead badge; there is no separate role field.
  function roleText() { return P.lead ? u('lead') : ''; }
  function periodHTML() { return '<span class="num">' + esc(period(P.period)) + '</span>' + (P.period.status === 'planned' ? ' <span class="badge">' + u('planned') + '</span>' : ''); }
  // [key, html] pairs for the metadata strip; Client only when the entry has one.
  function facts() {
    var f = [];
    if (P.client) f.push(['client', esc(clientName())]);
    if (P.org) f.push(['org', esc(t(P.org))]);
    f.push(['period', periodHTML()]);
    if (roleText()) f.push(['roleK', esc(roleText())]);
    return f;
  }
  function pagerHTML() {
    var pv = LIST[IDX - 1], nx = LIST[IDX + 1];
    var cell = function (s, k) {
      if (!s) return '<span class="pn-empty"></span>';
      return '<a class="pn-a pn-' + k + '" href="' + esc(caseHref(s)) + '" rel="' + k + '"><span class="pn-k">' + (k === 'prev' ? ICON.back : '') + u(k) + (k === 'next' ? ICON.arrow : '') +
        '</span><span class="pn-t">' + esc(t(C.projects[s].title)) + '</span></a>';
    };
    return '<nav class="pn" aria-label="' + u('pager') + '">' + cell(pv, 'prev') + cell(nx, 'next') + '</nav>';
  }
  function renderContacts() {
    var c = C.profile.contact;
    document.querySelectorAll('.contact').forEach(function (ul) { ul.innerHTML =
      (ul.id === 'contact' ? '<li class="now" id="c-now"></li>' : '') +
      '<li class="em"><a href="mailto:' + esc(c.email) + '">' + ICON.mail + '<span class="lbl">' + esc(c.email) + '</span></a></li>' +
      '<li><a href="' + esc(c.github) + '" rel="noopener">' + ICON.gh + '<span class="lbl">GitHub</span></a></li>' +
      '<li><a href="' + esc(c.linkedin) + '" rel="noopener">' + ICON.in + '<span class="lbl">LinkedIn</span></a></li>'; });
  }
  // Dossier Record rows of the base sidebar (no-op when the page has no #contact).
  function renderRecord() {
    var now = document.getElementById('c-now'); if (!now) return;
    var c3 = C.profile.contact;
    now.innerHTML = '<span class="k">' + u('now') + '</span><span class="v">' + esc(t(C.profile.currentRole)) + '</span>';
    var lis = document.querySelectorAll('#contact > li:not(.now)'), keys = [u('email'), 'GitHub', 'LinkedIn'],
        hs = [c3.email, c3.github.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''), c3.linkedin.replace(/^https?:\/\/(www\.)?linkedin\.com\//, '').replace(/\/$/, '')];
    lis.forEach(function (li, i) {
      var k = li.querySelector('.k') || li.insertBefore(document.createElement('span'), li.firstChild);
      k.className = 'k'; k.textContent = keys[i]; k.setAttribute('aria-hidden', 'true');
      var a = li.querySelector('a'); a.classList.add('v');
      if (i && !a.querySelector('.h')) { var h = document.createElement('span'); h.className = 'h'; h.setAttribute('aria-hidden', 'true'); h.textContent = hs[i]; a.appendChild(h); }
    });
  }

  function renderChrome() {
    document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = t(get(el.dataset.k)); });
    document.querySelectorAll('[data-ui]').forEach(function (el) { el.textContent = u(el.dataset.ui); });
    document.querySelectorAll('[data-ui-label]').forEach(function (el) { el.setAttribute('aria-label', u(el.dataset.uiLabel)); });
    document.querySelectorAll('[data-home]').forEach(function (a) { a.href = homeHref(a.dataset.home); });
    var ph = document.getElementById('photo'); if (ph) ph.alt = t(C.profile.name);
    document.querySelectorAll('#theme, .theme-btn').forEach(function (b) { b.setAttribute('aria-label', u('theme')); });
    var mb = document.getElementById('menu-btn'); if (mb) mb.setAttribute('aria-label', u('openMenu'));
    var lb = document.getElementById('lang-btn');
    if (lb) { lb.textContent = u('otherLang'); lb.lang = L === 'en' ? 'ko' : 'en'; lb.setAttribute('aria-label', u('switchLang')); }
    var sc = document.getElementById('sheet-close'); if (sc) sc.setAttribute('aria-label', u('closeMenu'));
    document.title = t(P.title) + ' · ' + t(C.profile.name);
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === L)); });
    renderRecord();
  }

  // Current-section highlight: elements with data-tab feed [data-nav] links and #bar-cur.
  var curTab = 'overview', io = null;
  function setCurrent(id) {
    curTab = id;
    var cur = document.getElementById('bar-cur'); if (cur) cur.textContent = u(id);
    document.querySelectorAll('[data-nav] a[href^="#"]').forEach(function (a) { a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + id)); });
    var bar = document.getElementById('tabs'), on = bar && bar.querySelector('[aria-current="true"]');
    if (on && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = on.offsetLeft - bar.offsetLeft - 16;
  }
  function observe() {
    if (!('IntersectionObserver' in window)) return;
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) setCurrent(en.target.dataset.tab); });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('[data-tab]').forEach(function (s) { io.observe(s); });
  }

  function setParam(k, v) {
    var q = new URLSearchParams(location.search); q.set(k, v);
    history.replaceState(null, '', '?' + q.toString() + location.hash);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.lang || b.id === 'lang-btn') { var lg = b.dataset.lang || (L === 'en' ? 'ko' : 'en'); root.lang = lg; setParam('lang', lg); renderAll(); }
    else if (b.id === 'theme' || b.classList.contains('theme-btn')) { var th = root.dataset.theme === 'dark' ? 'light' : 'dark'; root.dataset.theme = th; setParam('theme', th); }
  });

  var sheet = document.getElementById('sheet'), menuBtn = document.getElementById('menu-btn');
  if (sheet && menuBtn) {
    menuBtn.addEventListener('click', function () { sheet.showModal(); menuBtn.setAttribute('aria-expanded', 'true'); });
    sheet.addEventListener('close', function () { menuBtn.setAttribute('aria-expanded', 'false'); });
    sheet.addEventListener('click', function (e) {
      if (e.target === sheet || e.target.closest('#sheet-close, .sheet-nav a')) sheet.close();
    });
  }

  function renderAll() {
    L = root.lang;
    renderChrome();
    renderPage();
    setCurrent(curTab);
    observe();
  }
  renderContacts();

  var THEME_BTNS = '<div class="controls"><div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="ko" lang="ko">KO</button></div>' +
    '<button type="button" class="icon-btn" id="theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>';

  // Architecture as a ledger: one row per layer, its components, and where it hands off.
  function ledgerHTML() {
    var A = CS.architecture; if (!A) return '';
    var idx = {}; A.layers.forEach(function (l, i) { idx[l.id] = i; });
    return '<table class="tbl ledger"><thead><tr><th scope="col">' + u('layer') + '</th><th scope="col">' + u('parts') + '</th><th scope="col">' + u('flows') + '</th></tr></thead><tbody>' +
      A.layers.map(function (l, i) {
        var outs = (A.flows || []).filter(function (f) { return f.from === l.id; });
        return '<tr><td><span class="n">' + pad(i + 1) + '</span> ' + esc(t(l.label)) + '</td>' +
          '<td data-l="' + u('parts') + '"><ul>' + l.nodes.map(function (n) { return '<li>' + esc(t(n)) + '</li>'; }).join('') + '</ul></td>' +
          '<td' + (outs.length ? ' data-l="' + u('flows') + '"' : '') + '><span class="flow-col">' + outs.map(function (f) {
            var j = idx[f.to];
            return '<span class="flow' + (j < i ? ' back' : '') + '">' + (j < i ? '↩ ' : '→ ') + pad(j + 1) + ' ' + esc(t(A.layers[j].label)) + (f.label ? ' <em>· ' + esc(t(f.label)) + '</em>' : '') + '</span>';
          }).join('') + '</span></td></tr>';
      }).join('') + '</tbody></table>';
  }
  function decTable() {
    if (!CS.decisions) return '';
    return '<h3>' + u('decisions') + '</h3><table class="tbl"><thead><tr><th scope="col">' + (L === 'ko' ? '결정' : 'Decision') + '</th><th scope="col">' + (L === 'ko' ? '이유' : 'Why') + '</th><th scope="col">' + u('tradeoff') + '</th></tr></thead><tbody>' +
      CS.decisions.map(function (d) {
        return '<tr><td>' + esc(t(d.title)) + '</td><td data-l="' + (L === 'ko' ? '이유' : 'Why') + '">' + esc(t(d.rationale)) + '</td><td class="to" data-l="' + u('tradeoff') + '">' + esc(t(d.tradeoff)) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function renderPage() {
    var secs = [['context', CS.context], ['problem', CS.problem], ['role', CS.role], ['approach', CS.approach]];
    if (CS.architecture) secs.push(['arch']);
    secs.push(['outcome', CS.outcome]);
    var rec = facts().map(function (x) { return '<div><dt>' + u(x[0]) + '</dt><dd>' + x[1] + '</dd></div>'; }).join('') +
      '<div><dt>' + u('stack') + '</dt><dd class="stk">' + P.stack.map(esc).join(' · ') + '</dd></div>';
    var navLinks = secs.map(function (s) { return '<li><a href="#' + s[0] + '" aria-current="false">' + u(s[0]) + '</a></li>'; }).join('');

    document.getElementById('side').innerHTML =
      '<div class="who"><a href="' + esc(homeHref('#about')) + '"><img src="../../../public/images/profile.jpg" alt="">' + esc(t(C.profile.name)) + ' <span>' + esc(t(C.profile.headline)) + '</span></a></div>' +
      '<div><p class="crumb"><a href="' + esc(homeHref('#work')) + '">' + ICON.back + u('work') + '</a><span class="pos">' + pad(IDX + 1) + ' / ' + pad(LIST.length) + '</span></p>' +
      '<h1 class="cs-title">' + esc(t(P.title)) + '</h1></div>' +
      '<dl class="rec">' + rec + '</dl>' +
      '<nav class="toc" aria-label="' + u('onPage') + '"><ol data-nav>' + navLinks + '</ol></nav>' +
      '<div class="side-foot">' + pagerHTML() + '</div>';

    document.getElementById('sheet-nav').innerHTML = '<li><a href="' + esc(homeHref('#work')) + '"><span>← ' + u('work') + '</span></a></li>' + navLinks;

    document.getElementById('main').innerHTML =
      '<article class="card doc"><p class="lede">' + esc(t(P.summary)) + '</p>' +
      secs.map(function (s, i) {
        var body = s[0] === 'arch' ? ledgerHTML() : bl(s[1], s[0] === 'outcome' ? 'oc' : '');
        if (s[0] === 'approach') body += decTable();
        var badge = s[0] === 'outcome' && ONGOING ? '<span class="badge live">' + u('inProgress') + '</span>' : '';
        return '<section class="d-sec" id="' + s[0] + '" data-tab="' + s[0] + '" aria-labelledby="h-' + s[0] + '"><span class="no" aria-hidden="true">' + pad(i + 1) + '</span><div><h2 id="h-' + s[0] + '">' + u(s[0]) + badge + '</h2>' + body + '</div></section>';
      }).join('') + '</article>' +
      '<div class="pn-end">' + pagerHTML() + '</div>' +
      '<footer>© ' + esc(t(C.profile.name)) + ' — G4 · case study</footer>';
    document.getElementById('theme').setAttribute('aria-label', u('theme'));
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === L)); });
    curTab = curTab === 'overview' ? 'context' : curTab;
  }
  renderAll();
  // static ink under Work, re-measured when labels change
  var ink = document.getElementById('ink'), tabsEl = document.getElementById('tabs');
  function placeInk() { var on = tabsEl.querySelector('[aria-current="true"]'), n = ink.parentNode.getBoundingClientRect(), r = on.getBoundingClientRect();
    ink.style.setProperty('--ink-x', (r.left - n.left) + 'px'); ink.style.setProperty('--ink-w', r.width + 'px'); }
  if ('ResizeObserver' in window) new ResizeObserver(placeInk).observe(tabsEl);
  placeInk();
})();
</script>
