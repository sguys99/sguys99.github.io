<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG C. Front and back</title>
<script src="og-base.js"></script>
<link rel="stylesheet" href="og-base.css">
<style>
  /* C. Two cards, back (ink, KM mark) and front (name), offset and overlapping like a card pair on a desk.
     The KM mark ties the OG to the favicon without carrying the image. */
  .card { position: absolute; width: 700px; height: 400px; border-radius: var(--radius); }
  .back { right: 72px; top: 56px; background: var(--text); }
  /* KM sits in the strip of the back card the front card leaves visible */
  .back .km { position: absolute; right: 126px; top: 120px; width: 104px; height: 104px; display: block; }
  .back .url { position: absolute; right: 40px; bottom: 30px; font-size: 18px; color: var(--bg); opacity: 0.72; }
  .front { left: 72px; bottom: 56px; background: var(--surface); border: 1px solid var(--line-strong); padding: 44px 48px 36px; display: flex; flex-direction: column; }
  .nm { margin-top: auto; font-size: 64px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.02; }
  :lang(ko) .nm { font-size: 72px; letter-spacing: var(--ls-tagline-ko); }
  .nm .alt { font-family: var(--font-meta); font-size: 20px; font-weight: 400; letter-spacing: 0.02em; color: var(--text-3); margin-left: 18px; vertical-align: 0.6em; }
  .hl { font-size: 27px; font-weight: 500; color: var(--accent); margin-top: 12px; }
  .rule { height: 1px; background: var(--line); margin: 26px 0 18px; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 21px; color: var(--text-2); }
  .meta .url { font-size: 18px; color: var(--text-3); }
</style>
</head>
<body>
<div class="og">
  <div class="card back"><span data-km="inv"></span><span class="url mono">sguys99.github.io</span></div>
  <div class="card front">
    <p class="nm"><span data-ko="유광명">Kwang Myung Yu</span><span class="alt" lang-only="ko">Kwang Myung Yu</span></p>
    <p class="hl">AI Engineer</p>
    <div class="rule"></div>
    <div class="meta"><span data-ko="GenON R&D그룹 Director">Director, R&amp;D Group, GenON</span><span class="url mono">github.com/sguys99</span></div>
  </div>
</div>
</body>
</html>
