<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG B. Record sheet</title>
<script src="og-base.js"></script>
<link rel="stylesheet" href="og-base.css">
<style>
  /* B. The whole image is the card: name left, a hairline key/value ledger right (sidebar 기록표 grammar),
     career trajectory as the bottom strip. Most information, most "Dossier". */
  .og { padding: 64px 80px 56px; display: grid; grid-template-columns: 1fr 440px; grid-template-rows: 1fr auto; column-gap: 64px; }
  .left { display: flex; flex-direction: column; }
  .left .km { width: 44px; height: 44px; display: block; }
  .nm { margin-top: auto; font-size: 92px; font-weight: 600; letter-spacing: -0.035em; line-height: 0.98; }
  :lang(ko) .nm { font-size: 104px; letter-spacing: var(--ls-tagline-ko); }
  .alt { font-family: var(--font-meta); font-size: 22px; color: var(--text-3); margin-top: 18px; letter-spacing: 0.02em; }
  .ledger { align-self: end; border-top: 1px solid var(--line-strong); }
  .row { display: grid; grid-template-columns: 112px 1fr; padding: 15px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .k { font-family: var(--font-meta); font-size: 15px; letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-3); }
  :lang(ko) .k { letter-spacing: var(--ls-label-ko); font-family: var(--font-ko); font-size: 17px; font-weight: 500; }
  .v { font-size: 24px; color: var(--text-2); letter-spacing: -0.01em; line-height: 1.3; }
  .v.ac { color: var(--accent); font-weight: 500; }
  .v.mono { font-size: 21px; letter-spacing: 0; }
  .traj { grid-column: 1 / -1; margin-top: 44px; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line-strong); }
  .traj div { padding-top: 14px; position: relative; }
  .traj div::before { content: ''; position: absolute; top: -5px; left: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line-strong); }
  .traj div:last-child::before { background: var(--accent); border-color: var(--accent); }
  .traj .y { font-family: var(--font-meta); font-size: 16px; color: var(--text-3); }
  .traj .l { font-size: 19px; color: var(--text-2); margin-top: 4px; }
  .traj div:last-child .l { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<div class="og">
  <div class="left">
    <span data-km></span>
    <p class="nm" lang-only="en">Kwang<br>Myung Yu</p>
    <p class="nm" lang-only="ko">유광명</p>
    <p class="alt" lang-only="ko">Kwang Myung Yu</p>
  </div>
  <div class="ledger">
    <div class="row"><span class="k" data-ko="직함">Title</span><span class="v ac">AI Engineer</span></div>
    <div class="row"><span class="k" data-ko="현재">Now</span><span class="v" data-ko="GenON R&D그룹 Director">Director, R&amp;D Group, GenON</span></div>
    <div class="row"><span class="k" data-ko="웹">Web</span><span class="v mono">sguys99.github.io</span></div>
  </div>
  <div class="traj">
    <div><p class="y">2008</p><p class="l" data-ko="제어·자동화">Control &amp; Automation</p></div>
    <div><p class="y">2015</p><p class="l" data-ko="데이터 사이언스·머신러닝">Data Science &amp; ML</p></div>
    <div><p class="y">2023</p><p class="l" data-ko="생성형 AI·에이전트">Generative AI &amp; Agents</p></div>
    <div><p class="y">2026</p><p class="l">Physical AI</p></div>
  </div>
</div>
</body>
</html>
