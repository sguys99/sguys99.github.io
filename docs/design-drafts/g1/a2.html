<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft A′ · Quiet Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Set theme/lang before paint to avoid a flash.
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.documentElement.lang = q.get('lang') === 'ko' ? 'ko' : 'en';
  })();
</script>
<style>
  :root {
    /* Colors: unchanged from draft A */
    --bg: #f4f5f7;
    --surface: #ffffff;
    --line: #e1e4e9;
    --line-strong: #c9ced6;
    --text: #16191d;
    --text-2: #4a515b;
    --text-3: #69717c;
    --accent: #2d5b8c;
    --accent-soft: #e8eef6;
    --chip: #f0f2f5;
    --focus: #2d5b8c;
    --header-bg: rgba(244, 245, 247, 0.92);

    /* Type roles from the reference site */
    --font-head: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
    --font-body: "Public Sans", "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "IBM Plex Sans KR", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-ko: "IBM Plex Sans KR", "Public Sans", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;

    --fs-2xs: 0.6875rem;
    --fs-xs: 0.75rem;
    --fs-sm: 0.8125rem;
    --fs-md: 0.9375rem;
    --fs-lg: 1.0625rem;
    --fs-xl: 1.25rem;
    --fs-2xl: 1.625rem;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
    --radius: 12px;
    --radius-sm: 6px;
    --dur: 180ms;
    --sidebar: 250px;
    --main: 704px;
    --gap: 64px;
    --header-h: 60px;
  }
  [data-theme="dark"] {
    --bg: #0f1114;
    --surface: #16191d;
    --line: #262a31;
    --line-strong: #363b44;
    --text: #e8eaed;
    --text-2: #b3b9c2;
    --text-3: #8d949e;
    --accent: #8fb4e3;
    --accent-soft: #1b2633;
    --chip: #1d2127;
    --focus: #8fb4e3;
    --header-bg: rgba(15, 17, 20, 0.92);
  }
  /* Korean: one family for headings and body; mono stays for Latin/number meta */
  html:lang(ko) { --font-head: var(--font-ko); --font-body: var(--font-ko); }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: var(--fs-md);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }
  html:lang(ko) body { line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -0.01em; }
  h1, h2, h3 { font-family: var(--font-head); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: calc(var(--sidebar) + var(--gap) + var(--main) + 2 * var(--sp-5)); margin: 0 auto; padding: 0 var(--sp-5); }

  /* ---------- Top navigation ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg);
    -webkit-backdrop-filter: saturate(1.2) blur(8px); backdrop-filter: saturate(1.2) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap {
    height: var(--header-h);
    display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); column-gap: var(--gap); align-items: center;
  }
  .brand { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-md); text-decoration: none; letter-spacing: -0.01em; }
  .topnav { display: flex; align-items: center; gap: var(--sp-5); min-width: 0; }
  .tabs { display: flex; gap: var(--sp-5); margin: 0; padding: 0; list-style: none; }
  .tabs a {
    position: relative; display: block; padding: 6px 0; white-space: nowrap;
    font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); text-decoration: none;
    transition: color var(--dur) ease;
  }
  .tabs a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px;
    background: var(--accent); transform: scaleX(0); transition: transform var(--dur) ease;
  }
  .tabs a:hover { color: var(--text); }
  .tabs a[aria-current="true"] { color: var(--accent); }
  .tabs a[aria-current="true"]::after { transform: scaleX(1); }

  .controls { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; flex: none; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
  .seg button {
    font: inherit; font-family: var(--font-mono); font-size: var(--fs-2xs); font-weight: 500; letter-spacing: 0.04em;
    border: 0; background: none; color: var(--text-3); cursor: pointer;
    padding: 3px 9px; border-radius: 999px; min-height: 26px;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .icon-btn {
    display: inline-grid; place-items: center; width: 32px; height: 32px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
    color: var(--text-2); cursor: pointer; transition: color var(--dur) ease, border-color var(--dur) ease;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--line-strong); }
  .icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  [data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }

  /* ---------- Page layout ---------- */
  .page { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); column-gap: var(--gap); padding-top: var(--sp-7); padding-bottom: var(--sp-8); }
  aside.sidebar { position: sticky; top: calc(var(--header-h) + var(--sp-7)); align-self: start; }
  main { min-width: 0; }

  /* ---------- Sidebar ---------- */
  .photo {
    width: 200px; height: auto; aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--chip); display: block;
  }
  .id { margin-top: var(--sp-5); }
  .name { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -0.02em; margin: 0; line-height: 1.2; }
  html:lang(ko) .name { letter-spacing: -0.03em; }
  .rule { width: 40px; height: 2px; background: var(--accent); border: 0; margin: var(--sp-3) 0 var(--sp-3); border-radius: 2px; }
  .headline { margin: 0; color: var(--text); font-weight: 500; font-size: var(--fs-md); }
  .role { margin: 2px 0 0; color: var(--text-2); font-size: var(--fs-sm); line-height: 1.5; }
  .contact { list-style: none; margin: var(--sp-5) 0 0; padding: 0; display: grid; gap: var(--sp-2); }
  .contact a {
    display: flex; align-items: center; gap: var(--sp-3);
    text-decoration: none; color: var(--text-2); font-size: var(--fs-sm);
    transition: color var(--dur) ease;
  }
  .contact a:hover { color: var(--accent); }
  .contact svg { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .contact .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Sections ---------- */
  section { margin-bottom: var(--sp-7); scroll-margin-top: calc(var(--header-h) + var(--sp-5)); }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin: 0 0 var(--sp-4); }
  .sec-head h2 { display: flex; align-items: center; gap: var(--sp-3); margin: 0; font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .sec-head h2::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--accent); flex: none; }
  .sec-head .meta { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-3); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--sp-5) var(--sp-5); }

  /* About */
  .tagline { margin: 0 0 var(--sp-3); font-family: var(--font-head); font-size: var(--fs-xl); line-height: 1.35; font-weight: 600; letter-spacing: -0.015em; }
  html:lang(ko) .tagline { line-height: 1.5; letter-spacing: -0.03em; }
  .about { margin: 0; color: var(--text-2); }

  .traj { list-style: none; margin: var(--sp-5) 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4) var(--sp-5); }
  .traj li { min-width: 0; }
  .traj p { margin: var(--sp-2) 0 0; font-size: var(--fs-sm); color: var(--text-2); line-height: 1.55; }
  .chip {
    display: inline-flex; align-items: baseline; gap: var(--sp-2);
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
    font-size: var(--fs-sm); color: var(--text-2); line-height: 1.4;
  }
  .chip .yr { font-size: var(--fs-2xs); color: var(--text-3); }
  .chip.now { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .chip.now .yr { color: var(--accent); }

  .skills { margin: var(--sp-5) 0 0; padding: 0; border-top: 1px solid var(--line); }
  .skills div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line); }
  .skills div:last-child { border-bottom: 0; padding-bottom: 0; }
  .skills dt { font-size: var(--fs-sm); font-weight: 600; }
  .skills dd { margin: 0; font-size: var(--fs-sm); color: var(--text-2); }

  /* Shared row grammar: title + subtitle left, mono date right */
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows > li { padding: var(--sp-4) 0; border-top: 1px solid var(--line); }
  .rows > li:first-child { border-top: 0; padding-top: 0; }
  .rows > li:last-child { padding-bottom: 0; }
  .rh { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-1) var(--sp-5); align-items: baseline; }
  .rh h3 { margin: 0; font-size: var(--fs-md); font-weight: 600; line-height: 1.45; letter-spacing: -0.005em; }
  .when { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; text-align: right; }
  .sub { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--text-2); }
  .desc { margin: var(--sp-2) 0 0; font-size: var(--fs-sm); color: var(--text-2); }
  .current .when { color: var(--accent); }

  /* Selected Work: blocks split by hairlines inside one card */
  .proj .org { font-size: var(--fs-sm); color: var(--text-2); font-weight: 500; }
  .proj h3.t { margin: var(--sp-1) 0 0; font-size: var(--fs-lg); font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
  html:lang(ko) .proj h3.t { letter-spacing: -0.02em; }
  .proj .desc { margin-top: var(--sp-2); }
  .proj.rows > li, .work > li { padding: var(--sp-5) 0; }
  .work > li:first-child { padding-top: 0; }
  .work > li:last-child { padding-bottom: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: var(--sp-3) 0 0; padding: 0; list-style: none; }
  .tag { font-family: var(--font-mono); font-size: var(--fs-2xs); padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--text-2); line-height: 1.8; }
  .tag.k { background: var(--accent-soft); color: var(--accent); }
  .pfoot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-3); }
  .stack { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-3); margin: 0; min-width: 0; flex: 1 1 260px; line-height: 1.7; }
  .more {
    margin-left: auto; font-size: var(--fs-sm); font-weight: 500; color: var(--accent); text-decoration: none; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .more svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; transition: transform var(--dur) ease; }
  .more:hover svg { transform: translateX(3px); }
  .badge { font-family: var(--font-mono); font-size: var(--fs-2xs); padding: 0 6px; margin-left: 6px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--text-2); }

  /* Patents */
  .filters { margin-bottom: var(--sp-4); }
  .filters button { font-family: var(--font-body); font-size: var(--fs-xs); letter-spacing: 0; padding: 3px 12px; }
  .filters .n { font-family: var(--font-mono); }
  .pat .rows > li { padding: var(--sp-3) 0; }
  .pat .rows > li:first-child { padding-top: 0; }
  .pat .rh h3 { font-family: var(--font-body); font-weight: 500; font-size: var(--fs-sm); line-height: 1.55; }
  .pm { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--text-3); display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
  .st { display: inline-flex; align-items: center; gap: 5px; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--text-3); }
  .st.reg::before { background: var(--accent); border-color: var(--accent); }
  .st.reg { color: var(--text-2); }
  .toggle-all {
    margin-top: var(--sp-4); font: inherit; font-size: var(--fs-sm); font-weight: 500;
    background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
    color: var(--text-2); cursor: pointer; transition: border-color var(--dur) ease, color var(--dur) ease;
  }
  .toggle-all:hover { color: var(--accent); border-color: var(--line-strong); }
  .rows > li[hidden] { display: none; }

  footer { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--text-3); text-align: right; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) {
    :root { --sidebar: 220px; --gap: 40px; }
    .photo { width: 176px; }
    .tabs { gap: var(--sp-4); }
  }
  @media (max-width: 860px) {
    :root { --header-h: 52px; }
    .wrap { padding: 0 var(--sp-4); }
    .topbar .wrap { display: flex; gap: var(--sp-3); }
    .brand { display: none; }
    .topnav { flex: 1; gap: var(--sp-3); }
    /* Tabs scroll sideways; controls stay pinned on the right */
    .topnav nav { flex: 1; min-width: 0; }
    .tabs { margin: 0; overflow-x: auto; scrollbar-width: none; gap: var(--sp-4); padding-right: var(--sp-5);
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); }
    .tabs::-webkit-scrollbar { display: none; }
    .page { display: block; padding-top: var(--sp-5); }
    aside.sidebar {
      position: static; margin-bottom: var(--sp-6);
      display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--sp-3) var(--sp-4); align-items: center;
    }
    .photo { width: 64px; border-radius: var(--radius-sm); }
    .id { margin: 0; }
    .name { font-size: var(--fs-xl); }
    .rule { display: none; }
    .headline { font-size: var(--fs-sm); margin-top: 2px; }
    .role { font-size: var(--fs-xs); }
    .contact { grid-column: 1 / -1; margin: 0; display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); }
    section { margin-bottom: var(--sp-6); }
    .card { padding: var(--sp-4); }
    .sec-head h2 { font-size: var(--fs-lg); }
    .tagline { font-size: var(--fs-lg); }
  }
  @media (max-width: 560px) {
    .traj { grid-template-columns: minmax(0, 1fr); }
    .skills div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    /* Date moves above the title instead of squeezing it */
    .rh { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .rh .when { grid-row: 1; text-align: left; }
    .proj .rh .when { grid-row: auto; }
    .chip { font-size: var(--fs-xs); padding: 4px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#about" data-k="profile.name"></a>
    <div class="topnav">
      <nav aria-label="Sections"><ul class="tabs" id="tabs"></ul></nav>
      <div class="controls">
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="ko" lang="ko">KO</button>
        </div>
        <button type="button" class="icon-btn" id="theme" aria-label="Toggle dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="wrap page">
  <aside class="sidebar" aria-label="Profile">
    <img class="photo" id="photo" src="profile.jpg" alt="" width="200" height="250"
         onerror="this.onerror=null;this.src='../../../public/images/profile.jpg'">
    <div class="id">
      <h1 class="name" data-k="profile.name"></h1>
      <hr class="rule">
      <p class="headline" data-k="profile.headline"></p>
      <p class="role" data-k="profile.currentRole"></p>
    </div>
    <ul class="contact" id="contact"></ul>
  </aside>

  <main id="main">
    <section id="about" aria-labelledby="h-about">
      <div class="sec-head"><h2 id="h-about" data-ui="about"></h2></div>
      <div class="card">
        <p class="tagline" id="tagline"></p>
        <p class="about" data-k="profile.about"></p>
        <ol class="traj" id="traj" aria-label="Career trajectory"></ol>
        <dl class="skills" id="skills"></dl>
      </div>
    </section>

    <section id="work" aria-labelledby="h-work">
      <div class="sec-head"><h2 id="h-work" data-ui="work"></h2><span class="meta" id="work-meta"></span></div>
      <div class="card"><ol class="rows work proj" id="work-list"></ol></div>
    </section>

    <section id="experience" aria-labelledby="h-exp">
      <div class="sec-head"><h2 id="h-exp" data-ui="experience"></h2></div>
      <div class="card"><ol class="rows" id="exp-list"></ol></div>
    </section>

    <section class="pat" id="patents" aria-labelledby="h-pat">
      <div class="sec-head"><h2 id="h-pat" data-ui="patents"></h2><span class="meta" id="pat-meta"></span></div>
      <div class="card">
        <div class="filters seg" role="group" id="pat-filter" aria-label="Filter patents"></div>
        <ol class="rows" id="pat-list"></ol>
        <button type="button" class="toggle-all" id="pat-toggle" aria-controls="pat-list"></button>
      </div>
    </section>

    <footer id="foot"></footer>
  </main>
</div>

<script src="content.js"></script>
<script>
(function () {
  var C = window.CONTENT;
  var root = document.documentElement;
  var L = root.lang;
  var patFilter = 'all', patOpen = false, PAT_N = 5;
  var SECTIONS = ['about', 'work', 'experience', 'patents'];

  // UI chrome strings (drafting only; final site keeps these in src/i18n/)
  var UI = {
    about: { en: 'About', ko: '소개' },
    work: { en: 'Selected Work', ko: '대표 프로젝트' },
    experience: { en: 'Experience', ko: '경력' },
    patents: { en: 'Patents', ko: '특허' },
    read: { en: 'Read case study', ko: '케이스 스터디 보기' },
    present: { en: 'Present', ko: '현재' },
    planned: { en: 'Planned', ko: '예정' },
    all: { en: 'All', ko: '전체' },
    registered: { en: 'Registered', ko: '등록' },
    filed: { en: 'Filed', ko: '출원' },
    showAll: { en: 'Show all', ko: '모두 보기' },
    showLess: { en: 'Show less', ko: '접기' },
    of: { en: 'projects', ko: '건' },
    draft: { en: 'Draft A′ · Quiet Dossier', ko: '시안 A′ · Quiet Dossier' },
    theme: { en: 'Toggle dark mode', ko: '다크 모드 전환' }
  };
  var t = function (o) { return o == null ? '' : (typeof o === 'string' ? o : (o[L] || o.en || '')); };
  var u = function (k) { return UI[k][L]; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var get = function (path) { return path.split('.').reduce(function (o, k) { return o && o[k]; }, C); };

  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function ym(s) {
    if (!s) return '';
    var p = s.split('-');
    return L === 'ko' ? p[0] + '.' + p[1] + (p[2] ? '.' + p[2] : '') : (p[1] ? MON[+p[1] - 1] + ' ' : '') + p[0];
  }
  function period(p) {
    var end = p.status === 'present' ? u('present') : ym(p.end);
    return ym(p.start) + ' – ' + end;
  }

  var ICON = {
    mail: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    gh: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>',
    in: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
  };

  function renderStatic() {
    var c = C.profile.contact;
    document.getElementById('contact').innerHTML =
      '<li class="em"><a href="mailto:' + esc(c.email) + '">' + ICON.mail + '<span class="lbl">' + esc(c.email) + '</span></a></li>' +
      '<li><a href="' + esc(c.github) + '" rel="noopener">' + ICON.gh + '<span class="lbl">GitHub</span></a></li>' +
      '<li><a href="' + esc(c.linkedin) + '" rel="noopener">' + ICON.in + '<span class="lbl">LinkedIn</span></a></li>';
  }

  function render() {
    L = root.lang;
    document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = t(get(el.dataset.k)); });
    document.querySelectorAll('[data-ui]').forEach(function (el) { el.textContent = u(el.dataset.ui); });
    document.getElementById('photo').alt = t(C.profile.name);
    document.getElementById('theme').setAttribute('aria-label', u('theme'));
    document.getElementById('tagline').textContent = t(C.profile.taglines[0]);
    document.title = t(C.profile.name) + ' · ' + t(C.profile.headline);

    var cur = document.querySelector('.tabs a[aria-current="true"]');
    var curId = cur ? cur.getAttribute('href').slice(1) : 'about';
    document.getElementById('tabs').innerHTML = SECTIONS.map(function (id) {
      return '<li><a href="#' + id + '" aria-current="' + (id === curId) + '">' + u(id) + '</a></li>';
    }).join('');

    // Trajectory: chips with years, last stage is current
    var tr = C.profile.trajectory, last = tr.length - 1;
    document.getElementById('traj').innerHTML = tr.map(function (s, i) {
      var now = i === last;
      return '<li' + (now ? ' aria-current="step"' : '') + '><span class="chip' + (now ? ' now' : '') + '">' +
        '<span class="yr mono">' + esc(s.years) + '</span>' + esc(t(s.label)) + '</span><p>' + esc(t(s.description)) + '</p></li>';
    }).join('');

    document.getElementById('skills').innerHTML = C.profile.skills.map(function (s) {
      return '<div><dt>' + esc(t(s.label)) + '</dt><dd>' + esc(t(s.summary)) + '</dd></div>';
    }).join('');

    var feat = Object.values(C.projects).filter(function (p) { return p.featured; }).sort(function (a, b) { return a.order - b.order; });
    document.getElementById('work-meta').textContent = feat.length + ' / ' + Object.keys(C.projects).length + ' ' + u('of');
    document.getElementById('work-list').innerHTML = feat.map(function (p) {
      var client = p.client ? t(p.client.public ? p.client.name : p.client.label) : '';
      var org = esc(t(p.org)) + (client ? ' · ' + esc(client) : '');
      var planned = p.status === 'planned' || p.period.status === 'planned' ? '<span class="badge">' + u('planned') + '</span>' : '';
      var tags = [p.domain].concat(p.capability || []).filter(Boolean);
      return '<li><article>' +
        '<div class="rh"><span class="org">' + org + '</span><span class="when">' + period(p.period) + planned + '</span></div>' +
        '<h3 class="t">' + esc(t(p.title)) + '</h3>' +
        '<p class="desc">' + esc(t(p.summary)) + '</p>' +
        '<ul class="tags">' + tags.map(function (x, i) { return '<li class="tag' + (i ? ' k' : '') + '">' + esc(x) + '</li>'; }).join('') + '</ul>' +
        '<div class="pfoot">' + (p.stack && p.stack.length ? '<p class="stack">' + p.stack.map(esc).join(' · ') + '</p>' : '') +
        '<a class="more" href="#">' + u('read') + ICON.arrow + '<span class="sr-only">: ' + esc(t(p.title)) + '</span></a></div>' +
        '</article></li>';
    }).join('');

    document.getElementById('exp-list').innerHTML = Object.values(C.experience).map(function (e) {
      var now = e.period.status === 'present';
      return '<li' + (now ? ' class="current"' : '') + '>' +
        '<div class="rh"><h3>' + esc(t(e.org)) + '</h3><span class="when">' + period(e.period) + '</span></div>' +
        '<p class="sub">' + esc(t(e.role)) + '</p>' +
        '<p class="desc">' + esc(t(e.summary)) + '</p></li>';
    }).join('');

    renderPatents();
    document.getElementById('foot').textContent = '© ' + t(C.profile.name) + ' — ' + u('draft');

    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === L)); });
  }

  function renderPatents() {
    var all = Object.values(C.patents).slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var reg = all.filter(function (p) { return p.status === 'registered'; }).length;
    var counts = { all: all.length, registered: reg, filed: all.length - reg };
    document.getElementById('pat-meta').textContent = u('registered') + ' ' + reg + ' · ' + u('filed') + ' ' + (all.length - reg);
    document.getElementById('pat-filter').innerHTML = ['all', 'registered', 'filed'].map(function (k) {
      return '<button type="button" data-f="' + k + '" aria-pressed="' + (patFilter === k) + '">' + u(k) + ' <span class="n">' + counts[k] + '</span></button>';
    }).join('');
    var list = all.filter(function (p) { return patFilter === 'all' || p.status === patFilter; });
    document.getElementById('pat-list').innerHTML = list.map(function (p, i) {
      var r = p.status === 'registered';
      return '<li' + (!patOpen && i >= PAT_N ? ' hidden' : '') + '>' +
        '<div class="rh"><h3>' + esc(t(p.title)) + '</h3><span class="when">' + ym(p.date.slice(0, 7)) + '</span></div>' +
        '<p class="pm"><span class="st' + (r ? ' reg' : '') + '">' + u(p.status) + '</span>' +
        (p.number ? '<span class="mono">No. ' + esc(p.number) + '</span>' : '') + '</p></li>';
    }).join('');
    var btn = document.getElementById('pat-toggle');
    btn.hidden = list.length <= PAT_N;
    btn.setAttribute('aria-expanded', String(patOpen));
    btn.textContent = patOpen ? u('showLess') : u('showAll') + ' (' + list.length + ')';
  }

  function setParam(k, v) {
    var q = new URLSearchParams(location.search); q.set(k, v);
    history.replaceState(null, '', '?' + q.toString() + location.hash);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.lang) { root.lang = b.dataset.lang; setParam('lang', b.dataset.lang); render(); }
    else if (b.id === 'theme') { var th = root.dataset.theme === 'dark' ? 'light' : 'dark'; root.dataset.theme = th; setParam('theme', th); }
    else if (b.dataset.f) { patFilter = b.dataset.f; patOpen = false; renderPatents(); b = document.querySelector('[data-f="' + patFilter + '"]'); b && b.focus(); }
    else if (b.id === 'pat-toggle') { patOpen = !patOpen; renderPatents(); }
  });

  // Underline the tab of the section in view; keep it visible in the scrolling mobile tab bar.
  function setCurrent(id) {
    document.querySelectorAll('.tabs a').forEach(function (a) {
      var on = a.getAttribute('href') === '#' + id;
      a.setAttribute('aria-current', String(on));
      if (on && a.parentNode.parentNode.scrollWidth > a.parentNode.parentNode.clientWidth) {
        var bar = a.parentNode.parentNode;
        bar.scrollLeft = a.offsetLeft - bar.offsetLeft - 16;
      }
    });
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) setCurrent(en.target.id); });
    }, { rootMargin: '-20% 0px -70% 0px' });
    document.querySelectorAll('main section').forEach(function (s) { io.observe(s); });
  }

  renderStatic();
  render();
})();
</script>
</body>
</html>
