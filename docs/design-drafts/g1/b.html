<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G1 · B. Editorial Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Set theme before paint to avoid a flash.
  (function () {
    var q = new URLSearchParams(location.search), t = q.get('theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    if (q.get('lang') === 'ko') document.documentElement.lang = 'ko';
  })();
</script>
<style>
:root {
  --paper: #f4efe6;
  --paper-raised: #faf6ef;
  --ink: #1d1915;
  --ink-2: #4a433a;
  --muted: #6a6155;
  --rule: #d8cfc1;
  --rule-strong: #1d1915;
  --accent: #9a3412;
  --accent-ink: #9a3412;
  --accent-soft: rgba(154, 52, 18, 0.08);
  --focus: #9a3412;

  --font-display: "Newsreader", "Noto Serif KR", Georgia, serif;
  --font-body: "Instrument Sans", "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;

  --sidebar-w: 320px;
  --gutter: clamp(20px, 5vw, 88px);
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 72px; --s-9: 112px;
  --radius: 2px;
  --dur: 180ms;
  --ease: cubic-bezier(.2, .6, .2, 1);
  color-scheme: light;
}
[data-theme="dark"] {
  --paper: #1a1714;
  --paper-raised: #221e1a;
  --ink: #ede5d8;
  --ink-2: #cfc5b6;
  --muted: #a69b8b;
  --rule: #3a332c;
  --rule-strong: #ede5d8;
  --accent: #e59a78;
  --accent-ink: #e59a78;
  --accent-soft: rgba(229, 154, 120, 0.10);
  --focus: #e59a78;
  color-scheme: dark;
}
/* Korean: let the Korean faces lead so CJK punctuation (·) sits correctly. */
html:lang(ko) {
  --font-display: "Noto Serif KR", "Newsreader", Georgia, serif;
  --font-body: "Noto Sans KR", "Instrument Sans", system-ui, "Apple SD Gothic Neo", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
:lang(ko) body, html:lang(ko) { word-break: keep-all; overflow-wrap: anywhere; }
html:lang(ko) body { line-height: 1.75; letter-spacing: -0.005em; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: var(--radius); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  padding: var(--s-7) var(--s-6) var(--s-6);
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: var(--s-5);
  overflow-y: auto;
}
.masthead { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--rule-strong); padding-bottom: var(--s-2); }
.portrait { width: 132px; aspect-ratio: 4 / 5; object-fit: cover; display: block; border-radius: var(--radius); filter: saturate(.9); background: var(--rule); }
.id-name { font-family: var(--font-display); font-weight: 500; font-size: 34px; line-height: 1.05; letter-spacing: -0.015em; margin: 0; font-variation-settings: "opsz" 60; }
html:lang(ko) .id-name { font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.id-headline { margin: var(--s-2) 0 0; font-family: var(--font-display); font-style: italic; font-size: 19px; color: var(--accent-ink); }
html:lang(ko) .id-headline { font-style: normal; }
.id-role { margin: var(--s-1) 0 0; font-size: 14px; color: var(--ink-2); }
.contact { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.contact li { border-bottom: 1px solid var(--rule); }
.contact a { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); padding: 10px 0; text-decoration: none; font-size: 14px; color: var(--ink); transition: color var(--dur) var(--ease); }
.contact a span:last-child { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact a:hover { color: var(--accent-ink); }
.contact a:hover span:last-child { color: var(--accent-ink); }
.side-nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.side-nav a { font-family: var(--font-display); font-size: 18px; text-decoration: none; color: var(--ink-2); transition: color var(--dur) var(--ease); }
.side-nav a:hover { color: var(--accent-ink); }
.controls { margin-top: auto; display: flex; gap: var(--s-5); flex-wrap: wrap; }
.seg { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.seg-label { color: var(--muted); margin-right: var(--s-2); font-weight: 500; }
.seg button {
  font: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 0; cursor: pointer;
  color: var(--muted); padding: 6px 6px; border-bottom: 1px solid transparent; min-height: 32px;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- Main ---------- */
main { margin-left: var(--sidebar-w); padding: var(--s-8) var(--gutter) var(--s-9); max-width: calc(var(--sidebar-w) + 1040px); }
.section { padding-top: var(--s-8); }
.section + .section { margin-top: var(--s-7); border-top: 1px solid var(--rule-strong); }
.section:first-child { padding-top: 0; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 var(--s-3); }
html:lang(ko) .kicker { letter-spacing: .08em; }
.section-title {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 6.2vw, 84px); line-height: .98; letter-spacing: -0.03em; margin: 0 0 var(--s-7);
  font-variation-settings: "opsz" 72;
}
html:lang(ko) .section-title { font-weight: 600; font-size: clamp(36px, 4.8vw, 64px); line-height: 1.12; letter-spacing: -0.035em; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: var(--s-5); flex-wrap: wrap; margin-bottom: var(--s-7); }
.section-head .section-title { margin: 0; }
.section-head .aside-note { color: var(--muted); font-size: 14px; margin: 0 0 8px; }

/* About */
.tagline {
  font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.15; letter-spacing: -0.015em;
  margin: 0 0 var(--s-7); max-width: 22ch; color: var(--ink);
}
html:lang(ko) .tagline { font-style: normal; font-weight: 500; line-height: 1.35; letter-spacing: -0.03em; max-width: 20em; }
.tagline::before { content: "\201C"; color: var(--accent); margin-left: -0.45em; }
html:lang(ko) .tagline::before { margin-left: 0; margin-right: .1em; }
.about-grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: var(--s-7); align-items: start; }
.about-label { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; padding-top: 6px; border-top: 1px solid var(--rule); }
.about-text { font-size: 19px; line-height: 1.65; margin: 0; color: var(--ink); }
html:lang(ko) .about-text { font-size: 18px; line-height: 1.85; }

.subhead { font-family: var(--font-display); font-weight: 500; font-size: 26px; letter-spacing: -0.01em; margin: var(--s-8) 0 var(--s-5); display: flex; align-items: baseline; gap: var(--s-4); }
.subhead::after { content: ""; flex: 1; border-top: 1px solid var(--rule); transform: translateY(-6px); }
html:lang(ko) .subhead { font-weight: 600; font-size: 23px; }

.trajectory { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
.trajectory li { padding: 0 var(--s-5) 0 0; position: relative; }
.trajectory li + li { padding-left: var(--s-5); border-left: 1px solid var(--rule); }
.traj-years { font-family: var(--font-display); font-style: italic; font-size: 17px; color: var(--muted); display: block; font-variant-numeric: lining-nums; }
.traj-label { font-family: var(--font-display); font-weight: 500; font-size: 22px; line-height: 1.15; margin: var(--s-1) 0 var(--s-3); letter-spacing: -0.01em; }
html:lang(ko) .traj-label { font-weight: 600; font-size: 19px; line-height: 1.35; }
.traj-desc { font-size: 14px; color: var(--ink-2); margin: 0; line-height: 1.55; }
.trajectory li.now .traj-years { color: var(--accent-ink); }
.trajectory li.now .traj-label { color: var(--accent-ink); }
.traj-bar { height: 3px; background: var(--rule); margin-bottom: var(--s-4); }
.trajectory li.now .traj-bar { background: var(--accent); }

.skills { margin: 0; display: grid; grid-template-columns: 1fr; }
.skills div { display: grid; grid-template-columns: 200px 1fr; gap: var(--s-5); padding: var(--s-4) 0; border-top: 1px solid var(--rule); }
.skills div:last-child { border-bottom: 1px solid var(--rule); }
.skills dt { font-family: var(--font-display); font-size: 19px; font-weight: 500; }
html:lang(ko) .skills dt { font-weight: 600; font-size: 17px; }
.skills dd { margin: 0; color: var(--ink-2); font-size: 15px; }

/* Selected work */
.work { display: grid; grid-template-columns: repeat(2, 1fr); column-gap: var(--s-7); }
.work-item { padding: var(--s-6) 0; border-top: 1px solid var(--rule); display: flex; flex-direction: column; }
.work-item.feature {
  grid-column: 1 / -1; padding: var(--s-7) var(--s-7); margin-bottom: var(--s-5);
  background: var(--paper-raised); border-top: 3px solid var(--accent);
  display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--s-7);
}
.work-meta { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 var(--s-3); }
html:lang(ko) .work-meta { letter-spacing: .04em; }
.work-meta .client { color: var(--accent-ink); }
.work-title { font-family: var(--font-display); font-weight: 500; font-size: 28px; line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--s-3); }
html:lang(ko) .work-title { font-weight: 600; font-size: 24px; line-height: 1.35; letter-spacing: -0.03em; }
.feature .work-title { font-size: clamp(36px, 3.6vw, 52px); line-height: 1.02; letter-spacing: -0.025em; }
html:lang(ko) .feature .work-title { font-size: clamp(30px, 3vw, 42px); line-height: 1.25; }
.work-summary { margin: 0 0 var(--s-4); color: var(--ink-2); font-size: 15.5px; }
.feature .work-summary { font-size: 18px; color: var(--ink); }
.tags { margin: 0 0 var(--s-2); font-size: 13px; color: var(--ink); }
.tags span + span::before { content: " · "; color: var(--muted); }
.stack { margin: 0 0 var(--s-4); font-size: 13px; color: var(--muted); }
.work-side { border-left: 1px solid var(--rule); padding-left: var(--s-6); display: flex; flex-direction: column; gap: var(--s-4); }
.work-side dl { margin: 0; display: grid; gap: var(--s-3); }
.work-side dt { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.work-side dd { margin: 2px 0 0; font-size: 14px; }
.read-more {
  margin-top: auto; align-self: flex-start; font-size: 14px; font-weight: 600; color: var(--accent-ink); text-decoration: none;
  border-bottom: 1px solid currentColor; padding-bottom: 1px; display: inline-flex; gap: 6px; align-items: baseline;
}
.read-more .arr { transition: transform var(--dur) var(--ease); display: inline-block; }
.read-more:hover .arr { transform: translateX(3px); }
.feature .read-more { margin-top: var(--s-2); }

/* Experience */
.exp { list-style: none; margin: 0; padding: 0; }
.exp li { display: grid; grid-template-columns: 170px 1fr; gap: var(--s-6); padding: var(--s-6) 0; border-top: 1px solid var(--rule); }
.exp li:last-child { border-bottom: 1px solid var(--rule); }
.exp-period { font-family: var(--font-display); font-style: italic; font-size: 17px; color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
html:lang(ko) .exp-period { font-style: normal; font-family: var(--font-body); font-size: 15px; }
.exp-period .now { color: var(--accent-ink); }
.exp-org { font-family: var(--font-display); font-weight: 500; font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
html:lang(ko) .exp-org { font-weight: 600; font-size: 22px; line-height: 1.35; }
.exp-role { margin: var(--s-1) 0 var(--s-3); font-size: 14px; font-weight: 600; color: var(--accent-ink); }
.exp-summary { margin: 0; color: var(--ink-2); max-width: 68ch; }

/* Patents */
.pat-stats { display: flex; gap: var(--s-6); margin: 0; }
.pat-stats div { text-align: left; }
.pat-stats dt { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.pat-stats dd { margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: lining-nums; }
.pat-list { list-style: none; margin: 0; padding: 0; }
.pat-list li { display: grid; grid-template-columns: 1fr 110px 140px 92px; gap: var(--s-4); align-items: baseline; padding: 14px 0; border-top: 1px solid var(--rule); font-size: 15px; }
.pat-list li:last-child { border-bottom: 1px solid var(--rule); }
.pat-title { color: var(--ink); }
.pat-status { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pat-status.registered { color: var(--accent-ink); }
.pat-num, .pat-date { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pat-date { text-align: right; }
.pat-list li[hidden] { display: none; }
.pat-more {
  margin-top: var(--s-5); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: none; cursor: pointer;
  border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 10px 18px; min-height: 44px;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.pat-more:hover { background: var(--ink); color: var(--paper); }

footer.colophon { margin-top: var(--s-9); padding-top: var(--s-4); border-top: 1px solid var(--rule-strong); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .work-item.feature { grid-template-columns: 1fr; gap: var(--s-5); }
  .work-side { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: var(--s-4); }
  .trajectory { grid-template-columns: repeat(2, 1fr); row-gap: var(--s-6); }
  .trajectory li:nth-child(3) { padding-left: 0; border-left: 0; }
}
@media (max-width: 900px) {
  .sidebar {
    position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--rule-strong);
    padding: var(--s-5) 16px var(--s-4);
    display: grid; grid-template-columns: 72px 1fr; column-gap: var(--s-4); row-gap: var(--s-3); align-items: center;
  }
  .masthead { grid-column: 1 / -1; }
  .portrait { width: 72px; }
  .id-name { font-size: 28px; }
  .id-headline { font-size: 16px; margin-top: 2px; }
  .id-role { font-size: 13px; }
  .contact { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 20px; border-top: 0; }
  .contact li { border: 0; }
  .contact a { padding: 6px 0; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
  .contact a span:last-child { display: none; }
  .side-nav { display: none; }
  .controls { grid-column: 1 / -1; margin-top: 0; justify-content: space-between; }
  main { margin-left: 0; padding: var(--s-6) 16px var(--s-8); }
  .section { padding-top: var(--s-6); }
  .section + .section { margin-top: var(--s-6); }
  .section-title, .section-head { margin-bottom: var(--s-5); }
  .about-grid { grid-template-columns: 1fr; gap: var(--s-3); }
  .about-text { font-size: 17px; }
  .tagline { margin-bottom: var(--s-6); }
  .tagline::before { margin-left: 0; }
  .work { grid-template-columns: 1fr; }
  .work-item.feature { padding: var(--s-5) var(--s-4); margin: 0 -4px var(--s-3); }
  .skills div { grid-template-columns: 1fr; gap: var(--s-1); }
  .exp li { grid-template-columns: 1fr; gap: var(--s-2); padding: var(--s-5) 0; }
  .exp-org { font-size: 23px; }
  .pat-stats dd { font-size: 30px; }
  .pat-list li { grid-template-columns: 1fr auto; gap: 2px var(--s-3); }
  .pat-title { grid-column: 1 / -1; }
  .pat-status { grid-column: 1 / -1; order: -1; }
  .pat-num { grid-column: 1; }
  .pat-date { grid-column: 2; }
}
@media (max-width: 560px) {
  .trajectory { grid-template-columns: 1fr; }
  .trajectory li, .trajectory li + li { padding: 0; border-left: 0; }
  .subhead { font-size: 22px; margin-top: var(--s-7); }
  .work-title { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<aside class="sidebar" aria-label="Profile">
  <div class="masthead"><span data-i18n="dossier"></span><span>2026</span></div>
  <img class="portrait" src="profile.jpg" onerror="this.onerror=null;this.src='../../../public/images/profile.jpg'" alt="" id="portrait">
  <div>
    <h1 class="id-name" id="name"></h1>
    <p class="id-headline" id="headline"></p>
    <p class="id-role" id="role"></p>
  </div>
  <ul class="contact" id="contact"></ul>
  <nav class="side-nav" aria-label="Sections"><ol id="nav"></ol></nav>
  <div class="controls">
    <div class="seg" role="group" aria-labelledby="lang-lbl"><span class="seg-label" id="lang-lbl" data-i18n="language"></span>
      <button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="ko" lang="ko">KO</button></div>
    <div class="seg" role="group" aria-labelledby="theme-lbl"><span class="seg-label" id="theme-lbl" data-i18n="theme"></span>
      <button type="button" data-theme-set="light" data-i18n="light"></button><button type="button" data-theme-set="dark" data-i18n="dark"></button></div>
  </div>
</aside>

<main id="main">
  <section class="section" id="about" aria-labelledby="about-h">
    <p class="kicker" data-i18n="aboutKicker"></p>
    <h2 class="section-title" id="about-h" data-i18n="about"></h2>
    <p class="tagline" id="tagline"></p>
    <div class="about-grid">
      <p class="about-label" data-i18n="profile"></p>
      <p class="about-text" id="about-text"></p>
    </div>
    <h3 class="subhead" data-i18n="trajectory"></h3>
    <ol class="trajectory" id="trajectory"></ol>
    <h3 class="subhead" data-i18n="skills"></h3>
    <dl class="skills" id="skills"></dl>
  </section>

  <section class="section" id="work" aria-labelledby="work-h">
    <p class="kicker" data-i18n="workKicker"></p>
    <h2 class="section-title" id="work-h" data-i18n="work"></h2>
    <div class="work" id="work-list"></div>
  </section>

  <section class="section" id="experience" aria-labelledby="exp-h">
    <p class="kicker" data-i18n="expKicker"></p>
    <h2 class="section-title" id="exp-h" data-i18n="experience"></h2>
    <ol class="exp" id="exp-list"></ol>
  </section>

  <section class="section" id="patents" aria-labelledby="pat-h">
    <p class="kicker" data-i18n="patKicker"></p>
    <div class="section-head">
      <h2 class="section-title" id="pat-h" data-i18n="patents"></h2>
      <dl class="pat-stats" id="pat-stats"></dl>
    </div>
    <ul class="pat-list" id="pat-list"></ul>
    <button type="button" class="pat-more" id="pat-more" aria-controls="pat-list" aria-expanded="false"></button>
  </section>

  <footer class="colophon"><span id="foot-name"></span><span>sguys99.github.io</span></footer>
</main>

<script src="content.js"></script>
<script>
(function () {
  var C = window.CONTENT;
  var UI = {
    en: { dossier: 'Dossier', language: 'Lang', theme: 'Theme', light: 'Light', dark: 'Dark',
      about: 'About', aboutKicker: 'Profile', profile: 'In brief', trajectory: 'Trajectory', skills: 'Skills',
      work: 'Selected Work', workKicker: 'Projects', experience: 'Experience', expKicker: 'Career',
      patents: 'Patents', patKicker: 'Intellectual property', registered: 'Registered', filed: 'Filed', total: 'Total',
      readCase: 'Read case study', client: 'Client', org: 'Delivered at', period: 'Period', stack: 'Stack',
      showAll: function (n) { return 'Show all ' + n + ' patents'; }, showLess: 'Show fewer',
      present: 'Present', planned: 'planned', email: 'Email', github: 'GitHub', linkedin: 'LinkedIn', pending: '—' },
    ko: { dossier: '경력 소개', language: '언어', theme: '테마', light: '라이트', dark: '다크',
      about: '소개', aboutKicker: 'Profile', profile: '요약', trajectory: '경력 궤적', skills: '보유 역량',
      work: '대표 프로젝트', workKicker: 'Projects', experience: '경력', expKicker: 'Career',
      patents: '특허', patKicker: 'Intellectual property', registered: '등록', filed: '출원', total: '전체',
      readCase: '케이스 스터디 보기', client: '고객', org: '수행 조직', period: '기간', stack: '기술 스택',
      showAll: function (n) { return '특허 ' + n + '건 모두 보기'; }, showLess: '접기',
      present: '현재', planned: '예정', email: '이메일', github: 'GitHub', linkedin: 'LinkedIn', pending: '—' }
  };
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var q = new URLSearchParams(location.search);
  var lang = q.get('lang') === 'ko' ? 'ko' : 'en';
  var patOpen = false;
  var PAT_VISIBLE = 5;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function t(v) { return v && typeof v === 'object' ? (v[lang] || v.en || '') : (v || ''); }
  function list(o) { return Array.isArray(o) ? o : Object.keys(o).map(function (k) { return Object.assign({ id: k }, o[k]); }); }
  function ym(s) {
    if (!s) return '';
    var p = s.split('-');
    if (lang === 'ko') return p[0] + (p[1] ? '.' + p[1] : '') + (p[2] ? '.' + p[2] : '');
    return (p[1] ? MONTHS[+p[1] - 1] + ' ' : '') + (p[2] ? +p[2] + ', ' : '') + p[0];
  }
  function period(p) {
    var u = UI[lang];
    var end = p.status === 'present' ? '<span class="now">' + u.present + '</span>' : ym(p.end);
    var s = ym(p.start) + ' – ' + end;
    if (p.status === 'planned') s += ' (' + u.planned + ')';
    return s;
  }
  function client(p) {
    if (!p.client) return '';
    return p.client.public ? t(p.client.name) : t(p.client.label);
  }

  function render() {
    var u = UI[lang], P = C.profile;
    document.documentElement.lang = lang;
    document.title = t(P.name) + ' · ' + t(P.headline) + ' — G1 B';
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = u[el.dataset.i18n]; });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });

    $('name').textContent = t(P.name);
    $('foot-name').textContent = t(P.name);
    $('portrait').alt = t(P.name);
    $('headline').textContent = t(P.headline);
    $('role').textContent = t(P.currentRole);
    var c = P.contact;
    $('contact').innerHTML = [
      ['mailto:' + c.email, u.email, c.email],
      [c.github, u.github, c.github.replace(/^https?:\/\/(www\.)?/, '')],
      [c.linkedin, u.linkedin, c.linkedin.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')]
    ].map(function (r) {
      var ext = r[0].indexOf('http') === 0 ? ' target="_blank" rel="noopener"' : '';
      return '<li><a href="' + esc(r[0]) + '"' + ext + '><span>' + esc(r[1]) + '</span><span>' + esc(r[2]) + '</span></a></li>';
    }).join('');
    $('nav').innerHTML = [['about', u.about], ['work', u.work], ['experience', u.experience], ['patents', u.patents]]
      .map(function (n) { return '<li><a href="#' + n[0] + '">' + esc(n[1]) + '</a></li>'; }).join('');

    // About
    $('tagline').textContent = t(P.taglines[0]);
    $('about-text').textContent = t(P.about);
    var tr = P.trajectory;
    $('trajectory').innerHTML = tr.map(function (s, i) {
      return '<li' + (i === tr.length - 1 ? ' class="now" aria-current="step"' : '') + '><div class="traj-bar" aria-hidden="true"></div>' +
        '<span class="traj-years">' + esc(s.years) + '</span>' +
        '<p class="traj-label">' + esc(t(s.label)) + '</p>' +
        '<p class="traj-desc">' + esc(t(s.description)) + '</p></li>';
    }).join('');
    $('skills').innerHTML = P.skills.map(function (s) {
      return '<div><dt>' + esc(t(s.label)) + '</dt><dd>' + esc(t(s.summary)) + '</dd></div>';
    }).join('');

    // Selected work
    var work = list(C.projects).filter(function (p) { return p.featured; }).sort(function (a, b) { return a.order - b.order; });
    $('work-list').innerHTML = work.map(function (p, i) {
      var cl = client(p), org = t(p.org);
      var tags = [p.domain].concat(p.capability || []).filter(Boolean);
      var tagsHtml = '<p class="tags">' + tags.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</p>';
      var stack = p.stack && p.stack.length ? p.stack.join(', ') : '';
      var link = '<a class="read-more" href="#">' + esc(u.readCase) + '<span class="sr-only">: ' + esc(t(p.title)) + '</span> <span class="arr" aria-hidden="true">→</span></a>';
      if (i === 0) {
        return '<article class="work-item feature"><div>' +
          '<p class="work-meta"><span>' + esc(period(p.period).replace(/<[^>]+>/g, '')) + '</span></p>' +
          '<h3 class="work-title">' + esc(t(p.title)) + '</h3>' +
          '<p class="work-summary">' + esc(t(p.summary)) + '</p>' + link + '</div>' +
          '<div class="work-side"><dl>' +
          (cl ? '<div><dt>' + u.client + '</dt><dd>' + esc(cl) + '</dd></div>' : '') +
          '<div><dt>' + u.org + '</dt><dd>' + esc(org) + '</dd></div>' +
          '<div><dt>' + u.period + '</dt><dd>' + period(p.period) + '</dd></div>' +
          '<div><dt>' + (lang === 'ko' ? '분야' : 'Focus') + '</dt><dd>' + tags.map(esc).join(' · ') + '</dd></div>' +
          (stack ? '<div><dt>' + u.stack + '</dt><dd>' + esc(stack) + '</dd></div>' : '') +
          '</dl></div></article>';
      }
      return '<article class="work-item">' +
        '<p class="work-meta">' + (cl ? '<span class="client">' + esc(cl) + '</span>' : '') + '<span>' + esc(org) + '</span><span>' + esc(period(p.period).replace(/<[^>]+>/g, '')) + '</span></p>' +
        '<h3 class="work-title">' + esc(t(p.title)) + '</h3>' +
        '<p class="work-summary">' + esc(t(p.summary)) + '</p>' + tagsHtml +
        (stack ? '<p class="stack"><span class="sr-only">' + u.stack + ': </span>' + esc(stack) + '</p>' : '') + link + '</article>';
    }).join('');

    // Experience
    $('exp-list').innerHTML = list(C.experience).map(function (e) {
      return '<li><div class="exp-period">' + period(e.period) + '</div><div>' +
        '<h3 class="exp-org">' + esc(t(e.org)) + '</h3>' +
        '<p class="exp-role">' + esc(t(e.role)) + '</p>' +
        '<p class="exp-summary">' + esc(t(e.summary)) + '</p></div></li>';
    }).join('');

    // Patents: newest first
    var pats = list(C.patents).sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
    var reg = pats.filter(function (p) { return p.status === 'registered'; }).length;
    $('pat-stats').innerHTML = '<div><dt>' + u.total + '</dt><dd>' + pats.length + '</dd></div>' +
      '<div><dt>' + u.registered + '</dt><dd>' + reg + '</dd></div>' +
      '<div><dt>' + u.filed + '</dt><dd>' + (pats.length - reg) + '</dd></div>';
    $('pat-list').innerHTML = pats.map(function (p, i) {
      return '<li' + (!patOpen && i >= PAT_VISIBLE ? ' hidden' : '') + '>' +
        '<span class="pat-title">' + esc(t(p.title)) + '</span>' +
        '<span class="pat-status ' + p.status + '">' + u[p.status] + '</span>' +
        '<span class="pat-num">' + (p.number ? 'No. ' + esc(p.number) : u.pending) + '</span>' +
        '<span class="pat-date">' + esc(ym(p.date)) + '</span></li>';
    }).join('');
    var more = $('pat-more');
    more.textContent = patOpen ? u.showLess : u.showAll(pats.length);
    more.setAttribute('aria-expanded', String(patOpen));
  }

  function setTheme(th) {
    document.documentElement.dataset.theme = th;
    document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeSet === th)); });
  }

  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.dataset.lang; render(); });
  });
  document.querySelectorAll('[data-theme-set]').forEach(function (b) {
    b.addEventListener('click', function () { setTheme(b.dataset.themeSet); });
  });
  $('pat-more').addEventListener('click', function () { patOpen = !patOpen; render(); });

  setTheme(document.documentElement.dataset.theme);
  render();
})();
</script>
</body>
</html>
