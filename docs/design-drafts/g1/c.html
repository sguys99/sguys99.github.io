<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kwang Myung Yu · Draft C — Blueprint Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>
  // Set theme/lang before first paint to avoid a flash.
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('theme');
    var l = q.get('lang');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.documentElement.lang = l === 'ko' ? 'ko' : 'en';
  })();
</script>
<style>
  :root {
    --bg: #edf1f6;
    --surface: #f9fbfd;
    --ink: #0f1f3d;
    --ink-2: #33425e;
    --muted: #57647e;
    --line: #c4cedc;
    --line-soft: #dce3ec;
    --grid: rgba(15, 31, 61, 0.05);
    --accent: #c2410c;
    --accent-soft: rgba(194, 65, 12, 0.08);
    --focus: #c2410c;

    --font-sans: "IBM Plex Sans", "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    --font-ko: "IBM Plex Sans KR", "IBM Plex Sans", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --sidebar-w: 320px;
    --radius: 2px;
    --dur: 180ms;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0a1322;
    --surface: #0f1b2f;
    --ink: #e3e9f3;
    --ink-2: #b9c4d7;
    --muted: #8e9cb5;
    --line: #26364f;
    --line-soft: #1b2a42;
    --grid: rgba(140, 170, 220, 0.055);
    --accent: #ff8f57;
    --accent-soft: rgba(255, 143, 87, 0.1);
    --focus: #ff8f57;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.6 var(--font-sans);
    -webkit-font-smoothing: antialiased;
    transition: background-color var(--dur) ease, color var(--dur) ease;
  }
  :lang(ko) body, :lang(ko) .sans { font-family: var(--font-ko); }
  :lang(ko) body { line-height: 1.75; letter-spacing: -0.005em; word-break: keep-all; overflow-wrap: anywhere; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius); }
  .mono { font-family: var(--font-mono); font-feature-settings: "zero" 1; letter-spacing: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: absolute; left: 12px; top: -48px; background: var(--ink); color: var(--bg); padding: 8px 12px; z-index: 10; font-size: 13px; }
  .skip:focus { top: 12px; }

  /* ───────── Sidebar ───────── */
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
    overflow-y: auto;
    border-right: 1px solid var(--line);
    padding: 24px 28px 32px;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 16px 16px;
    display: flex; flex-direction: column; gap: 28px;
    transition: background-color var(--dur) ease, border-color var(--dur) ease;
  }
  .controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .seg button, .btn {
    font: 500 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); background: transparent; border: 0; padding: 7px 10px; cursor: pointer;
    border-radius: var(--radius);
    transition: color var(--dur) ease, background-color var(--dur) ease;
  }
  .seg button + button { border-left: 1px solid var(--line); border-radius: 0; }
  .seg button[aria-pressed="true"] { color: var(--ink); background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
  .seg button:hover, .btn:hover { color: var(--ink); }
  .btn { border: 1px solid var(--line); background: var(--surface); display: inline-flex; gap: 6px; align-items: center; }
  .btn svg { width: 12px; height: 12px; }

  .ident { display: grid; gap: 14px; }
  .photo {
    position: relative; width: 112px; aspect-ratio: 4 / 5; margin: 0;
    border: 1px solid var(--line); background: var(--surface); padding: 4px;
  }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.15); }
  .ticks::before, .ticks::after {
    content: ""; position: absolute; width: 8px; height: 8px; pointer-events: none;
    border-color: var(--accent); border-style: solid;
  }
  .ticks::before { top: -5px; left: -5px; border-width: 1px 0 0 1px; }
  .ticks::after { bottom: -5px; right: -5px; border-width: 0 1px 1px 0; }
  .name { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; }
  .headline { margin: 6px 0 0; font: 500 12px/1.4 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .role { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.5; }

  .kv { margin: 0; display: grid; grid-template-columns: 64px 1fr; border-top: 1px solid var(--line); }
  .kv dt, .kv dd { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
  .kv dt { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 9px; }
  .kv dd { font-family: var(--font-mono); min-width: 0; overflow-wrap: anywhere; }
  .kv a { text-decoration: none; border-bottom: 1px solid transparent; transition: border-color var(--dur) ease, color var(--dur) ease; }
  .kv a:hover { color: var(--accent); border-bottom-color: currentColor; }

  .label { font: 500 10.5px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
  .label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc a {
    display: grid; grid-template-columns: 28px 1fr; align-items: baseline;
    padding: 5px 0; text-decoration: none; font-size: 13.5px; color: var(--ink-2);
    transition: color var(--dur) ease;
  }
  .toc a span:first-child { font: 400 11px var(--font-mono); color: var(--muted); }
  .toc a:hover, .toc a[aria-current="true"] { color: var(--ink); }
  .toc a[aria-current="true"] span:first-child { color: var(--accent); }

  /* Trajectory axis (sidebar) */
  .axis { list-style: none; margin: 0; padding: 0 0 0 22px; position: relative; }
  .axis::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
  .axis li { position: relative; padding: 0 0 16px; }
  .axis li:last-child { padding-bottom: 0; }
  .axis li::before {
    content: ""; position: absolute; left: -22px; top: 5px; width: 9px; height: 9px;
    border: 1px solid var(--ink-2); background: var(--bg); border-radius: 50%;
  }
  .axis li.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .axis .yrs { display: block; font: 400 11px/1.4 var(--font-mono); color: var(--muted); }
  .axis .lbl { display: block; font-size: 14px; font-weight: 500; line-height: 1.4; }
  .axis .tid { color: var(--accent); margin-right: 6px; }

  /* ───────── Main ───────── */
  main { margin-left: var(--sidebar-w); padding: 48px clamp(24px, 5vw, 72px) 96px; }
  .wrap { max-width: 880px; display: grid; gap: 64px; }

  .sec-head { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 14px; padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--ink); }
  .sec-no { font: 500 13px var(--font-mono); color: var(--accent); }
  .sec-head h2 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em; }
  .sec-meta { font: 400 11px var(--font-mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }

  .card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    transition: background-color var(--dur) ease, border-color var(--dur) ease;
  }
  .pad { padding: 28px 32px; }

  /* About */
  .tagline { margin: 0 0 14px; font-size: 28px; line-height: 1.3; font-weight: 500; letter-spacing: -0.02em; max-width: 30ch; }
  :lang(ko) .tagline { letter-spacing: -0.03em; line-height: 1.4; max-width: 24em; }
  .about-text { margin: 0; color: var(--ink-2); max-width: 68ch; }
  .sub { margin-top: 32px; }

  .traj { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
  .traj li { position: relative; padding: 20px 16px 4px 0; }
  .traj li + li { padding-left: 16px; border-left: 1px dashed var(--line); }
  .traj li::before { content: ""; position: absolute; top: -5px; left: 0; width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--ink-2); background: var(--surface); }
  .traj li + li::before { left: -5px; }
  .traj li.now::before { background: var(--accent); border-color: var(--accent); }
  .traj .meta { display: flex; justify-content: space-between; font: 400 11px var(--font-mono); color: var(--muted); }
  .traj .meta b { color: var(--accent); font-weight: 500; }
  .traj h4 { margin: 6px 0 6px; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .traj p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.6; }

  .spec { margin: 0; display: grid; grid-template-columns: 180px 1fr; border-top: 1px solid var(--line); }
  .spec dt, .spec dd { margin: 0; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .spec dt { font-size: 13px; font-weight: 600; display: flex; gap: 10px; }
  .spec dt .mono { font-size: 11px; color: var(--muted); font-weight: 400; padding-top: 2px; }
  .spec dd { font-size: 14px; color: var(--ink-2); }

  /* Projects */
  .projects { display: grid; gap: 16px; }
  .proj { display: grid; grid-template-columns: 196px 1fr; }
  .proj-meta { padding: 22px 20px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 12px; }
  .pid { font: 500 12px var(--font-mono); color: var(--accent); letter-spacing: 0.06em; display: flex; gap: 8px; align-items: center; }
  .pid .flag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); padding: 2px 5px; letter-spacing: 0.08em; }
  .pm { margin: 0; display: grid; gap: 10px; }
  .pm div { display: grid; gap: 1px; }
  .pm dt { font: 400 10px/1.3 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .pm dd { margin: 0; font-size: 13px; line-height: 1.45; }
  .pm dd.mono { font-size: 12px; }
  .proj-body { padding: 22px 26px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .proj-body h3 { margin: 0; font-size: 19px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; }
  :lang(ko) .proj-body h3 { letter-spacing: -0.02em; }
  .proj-body p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips li { font: 400 11.5px/1 var(--font-mono); padding: 5px 7px; border: 1px solid var(--line); color: var(--ink-2); border-radius: var(--radius); }
  .chips li.tag { border-color: var(--accent); color: var(--accent); }
  .proj-foot { margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .more { font-size: 13.5px; font-weight: 500; color: var(--accent); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .more span { transition: transform var(--dur) ease; }
  .more:hover span { transform: translateX(3px); }

  /* Experience */
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 196px 1fr; border-top: 1px solid var(--line-soft); }
  .row:first-child { border-top: 0; }
  .row > .when { padding: 22px 20px; border-right: 1px solid var(--line); font: 400 12px/1.5 var(--font-mono); color: var(--ink-2); }
  .row > .when .eid { display: block; color: var(--accent); font-weight: 500; margin-bottom: 4px; }
  .row > .what { padding: 20px 26px 22px; min-width: 0; }
  .row h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; }
  .row .r { margin: 2px 0 8px; font-size: 13.5px; color: var(--accent); font-weight: 500; }
  .row p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .now-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }

  /* Patents */
  .tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .count { font: 400 11.5px var(--font-mono); color: var(--muted); letter-spacing: 0.04em; }
  .count b { color: var(--ink); font-weight: 500; }
  .plist { list-style: none; margin: 0; padding: 0; }
  .pat { display: grid; grid-template-columns: 52px 1fr auto; gap: 0 16px; align-items: baseline; padding: 13px 20px; border-bottom: 1px solid var(--line-soft); }
  .pat .no { font: 400 11.5px var(--font-mono); color: var(--muted); }
  .pat .t { font-size: 14px; line-height: 1.5; }
  .pat .m { grid-column: 2; font: 400 11.5px/1.5 var(--font-mono); color: var(--muted); margin-top: 3px; }
  .pat .st { grid-row: 1; grid-column: 3; font: 500 10px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pat .st.reg { border-color: var(--accent); color: var(--accent); }
  /* Mono is for Latin/number meta only: Korean labels switch to the Korean sans. */
  :lang(ko) .pat .st, :lang(ko) .label, :lang(ko) .sec-meta, :lang(ko) .pm dt, :lang(ko) .pid .flag,
  :lang(ko) .seg button:not([data-lang]), :lang(ko) .btn { font-family: var(--font-ko); letter-spacing: 0.02em; }
  :lang(ko) .label { font-size: 11.5px; font-weight: 600; }
  :lang(ko) .pm dt { font-size: 11px; }
  .plist-foot { padding: 14px 20px; display: flex; justify-content: center; }

  .colophon { font: 400 11px var(--font-mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* ───────── Responsive ───────── */
  @media (max-width: 1100px) {
    .proj, .row { grid-template-columns: 168px 1fr; }
  }
  @media (max-width: 960px) {
    .sidebar {
      position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--line);
      padding: 16px 20px 20px; gap: 18px; overflow: visible;
    }
    .ident { grid-template-columns: 76px 1fr; align-items: center; gap: 16px; }
    .photo { width: 76px; padding: 3px; }
    .name { font-size: 21px; }
    .toc, .side-traj { display: none; }
    .kv { grid-template-columns: 64px 1fr; }
    main { margin-left: 0; padding: 32px 16px 64px; }
    .wrap { gap: 48px; }
    .pad { padding: 20px 18px; }
    .tagline { font-size: 22px; }
    .sec-head h2 { font-size: 22px; }
    .traj { grid-template-columns: 1fr; border-top: 0; padding-left: 20px; position: relative; }
    .traj::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
    .traj li, .traj li + li { padding: 0 0 18px; border-left: 0; }
    .traj li::before, .traj li + li::before { top: 4px; left: -20px; }
    .spec { grid-template-columns: 1fr; }
    .spec dt { padding-bottom: 2px; border-bottom: 0; }
    .spec dd { padding-top: 0; }
    .proj, .row { grid-template-columns: 1fr; }
    .proj-meta { border-right: 0; border-bottom: 1px dashed var(--line); padding: 16px 18px; grid-template-columns: 1fr; }
    .pm { grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .proj-body { padding: 16px 18px 18px; }
    .row > .when { border-right: 0; padding: 18px 18px 0; }
    .row > .when .eid { display: inline; margin-right: 10px; }
    .row > .what { padding: 6px 18px 20px; }
    .pat { grid-template-columns: 1fr auto; padding: 12px 16px; }
    .pat .no { display: none; }
    .pat .t { grid-column: 1; }
    .pat .m { grid-column: 1 / -1; }
    .pat .st { grid-column: 2; }
    .tools, .plist-foot { padding: 12px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>
<aside class="sidebar" id="sidebar"></aside>
<main id="main" tabindex="-1"><div class="wrap" id="wrap"></div></main>

<script src="content.js"></script>
<script>
(function () {
  var C = window.CONTENT;
  var root = document.documentElement;
  var state = { lang: root.lang, patentFilter: 'all', patentsOpen: false };
  var themeLocked = new URLSearchParams(location.search).has('theme');

  var UI = {
    en: {
      skip: 'Skip to content', theme: 'Theme', light: 'Light', dark: 'Dark', language: 'Language',
      email: 'Email', github: 'GitHub', linkedin: 'LinkedIn', contents: 'Contents', trajectory: 'Trajectory',
      about: 'About', work: 'Selected Work', experience: 'Experience', patents: 'Patents',
      skills: 'Skills', stages: 'stages', entries: 'entries', projects: 'projects', positions: 'positions',
      present: 'Present', planned: 'Planned', lead: 'Lead',
      period: 'Period', domain: 'Domain', capability: 'Capability', client: 'Client', org: 'Organization', stack: 'Stack',
      readCase: 'Read case study', all: 'All', registered: 'Registered', filed: 'Filed',
      reg: 'Reg.', appl: 'Appl.', showAll: 'Show all', showLess: 'Show less', of: 'of',
      photo: 'Portrait of Kwang Myung Yu', draft: 'Draft C — Blueprint Dossier'
    },
    ko: {
      skip: '본문으로 건너뛰기', theme: '테마', light: '라이트', dark: '다크', language: '언어',
      email: 'Email', github: 'GitHub', linkedin: 'LinkedIn', contents: '목차', trajectory: '경력 궤적',
      about: '소개', work: '대표 프로젝트', experience: '경력', patents: '특허',
      skills: '기술', stages: '단계', entries: '건', projects: '건', positions: '곳',
      present: '현재', planned: '예정', lead: '리드',
      period: '기간', domain: '도메인', capability: '역량', client: '고객사', org: '소속', stack: '스택',
      readCase: '케이스 스터디 보기', all: '전체', registered: '등록', filed: '출원',
      reg: '등록', appl: '출원', showAll: '전체 보기', showLess: '접기', of: '/',
      photo: '유광명 프로필 사진', draft: 'Draft C — Blueprint Dossier'
    }
  };

  function u(k) { return UI[state.lang][k]; }
  function t(o) { return o == null ? '' : typeof o === 'string' ? o : (o[state.lang] || o.en || ''); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ym(s) { return s ? s.replace(/-/g, '.') : ''; }
  function period(p) {
    var end = p.status === 'present' ? u('present') : ym(p.end);
    return ym(p.start) + ' — ' + end;
  }
  function list(obj) { return Object.keys(obj).map(function (k) { return obj[k]; }); }

  var P = C.profile;
  var SECTIONS = [['about', 'about'], ['work', 'work'], ['experience', 'experience'], ['patents', 'patents']];

  function renderSidebar() {
    var traj = P.trajectory.map(function (s, i) {
      return '<li class="' + (i === P.trajectory.length - 1 ? 'now' : '') + '"><span class="yrs mono"><span class="tid">T' + (i + 1) + '</span>' + esc(s.years) + '</span><span class="lbl">' + esc(t(s.label)) + '</span></li>';
    }).join('');
    var gh = P.contact.github.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
    var li = P.contact.linkedin.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
    document.getElementById('sidebar').innerHTML =
      '<div class="controls">' +
        '<div class="seg" role="group" aria-label="' + u('language') + '">' +
          '<button type="button" data-lang="en" aria-pressed="' + (state.lang === 'en') + '">EN</button>' +
          '<button type="button" data-lang="ko" aria-pressed="' + (state.lang === 'ko') + '">KO</button>' +
        '</div>' +
        '<button type="button" class="btn" id="themeBtn" aria-label="' + u('theme') + ': ' + u(root.dataset.theme) + '">' +
          (root.dataset.theme === 'dark'
            ? '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8.5 1.5a4.5 4.5 0 1 0 2 6 3.6 3.6 0 0 1-2-6z" fill="currentColor"/></svg>'
            : '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="2.4" fill="none" stroke="currentColor"/><path d="M6 .5v1.6M6 9.9v1.6M.5 6h1.6M9.9 6h1.6M2.1 2.1l1.1 1.1M8.8 8.8l1.1 1.1M2.1 9.9l1.1-1.1M8.8 3.2l1.1-1.1" stroke="currentColor"/></svg>') +
          '<span>' + u(root.dataset.theme) + '</span></button>' +
      '</div>' +
      '<div class="ident">' +
        '<figure class="photo ticks"><img src="profile.jpg" alt="' + esc(u('photo')) + '" width="1200" height="1500" onerror="this.onerror=null;this.src=\'../../../public/images/profile.jpg\'"></figure>' +
        '<div><h1 class="name">' + esc(t(P.name)) + '</h1>' +
        '<p class="headline">' + esc(t(P.headline)) + '</p>' +
        '<p class="role">' + esc(t(P.currentRole)) + '</p></div>' +
      '</div>' +
      '<dl class="kv">' +
        '<dt>' + u('email') + '</dt><dd><a href="mailto:' + esc(P.contact.email) + '">' + esc(P.contact.email) + '</a></dd>' +
        '<dt>' + u('github') + '</dt><dd><a href="' + esc(P.contact.github) + '" rel="me noopener">' + esc(gh) + '</a></dd>' +
        '<dt>' + u('linkedin') + '</dt><dd><a href="' + esc(P.contact.linkedin) + '" rel="me noopener">' + esc(li) + '</a></dd>' +
      '</dl>' +
      '<nav class="toc" aria-label="' + u('contents') + '"><p class="label">' + u('contents') + '</p><ol>' +
        SECTIONS.map(function (s, i) { return '<li><a href="#' + s[0] + '"><span>' + pad(i + 1) + '</span><span>' + u(s[1]) + '</span></a></li>'; }).join('') +
      '</ol></nav>' +
      '<section class="side-traj" aria-label="' + u('trajectory') + '"><p class="label">' + u('trajectory') + '</p><ol class="axis">' + traj + '</ol></section>';
  }

  function head(i, id, meta) {
    return '<header class="sec-head"><span class="sec-no">' + pad(i) + '</span><h2 id="' + id + '-h">' + u(id) + '</h2><span class="sec-meta">' + meta + '</span></header>';
  }

  function renderAbout() {
    var traj = P.trajectory.map(function (s, i) {
      return '<li class="' + (i === P.trajectory.length - 1 ? 'now' : '') + '"><div class="meta"><b>T' + (i + 1) + '</b><span>' + esc(s.years) + '</span></div><h4>' + esc(t(s.label)) + '</h4><p>' + esc(t(s.description)) + '</p></li>';
    }).join('');
    var skills = P.skills.map(function (s, i) {
      return '<dt><span class="mono">S' + (i + 1) + '</span>' + esc(t(s.label)) + '</dt><dd>' + esc(t(s.summary)) + '</dd>';
    }).join('');
    return '<section id="about" aria-labelledby="about-h">' + head(1, 'about', P.trajectory.length + ' ' + u('stages')) +
      '<div class="card pad">' +
        '<p class="tagline">' + esc(t(P.taglines[0])) + '</p>' +
        '<p class="about-text">' + esc(t(P.about)) + '</p>' +
        '<div class="sub"><p class="label">' + u('trajectory') + '</p><ol class="traj">' + traj + '</ol></div>' +
        '<div class="sub"><p class="label">' + u('skills') + '</p><dl class="spec">' + skills + '</dl></div>' +
      '</div></section>';
  }

  function renderWork() {
    var items = list(C.projects).filter(function (p) { return p.featured; }).sort(function (a, b) { return a.order - b.order; });
    var cards = items.map(function (p, i) {
      var client = p.client ? (p.client.public ? t(p.client.name) : t(p.client.label)) : '';
      var status = p.period.status === 'planned' ? '<span class="flag">' + u('planned') + '</span>' : (p.lead ? '<span class="flag">' + u('lead') + '</span>' : '');
      return '<article class="card proj ticks">' +
        '<div class="proj-meta"><div class="pid">P-' + pad(p.order) + status + '</div><dl class="pm">' +
          '<div><dt>' + u('period') + '</dt><dd class="mono">' + period(p.period) + '</dd></div>' +
          '<div><dt>' + u('org') + '</dt><dd>' + esc(t(p.org)) + '</dd></div>' +
          (client ? '<div><dt>' + u('client') + '</dt><dd>' + esc(client) + '</dd></div>' : '') +
          '<div><dt>' + u('domain') + '</dt><dd>' + esc(p.domain) + '</dd></div>' +
        '</dl></div>' +
        '<div class="proj-body">' +
          '<h3>' + esc(t(p.title)) + '</h3>' +
          '<p>' + esc(t(p.summary)) + '</p>' +
          '<ul class="chips" aria-label="' + u('capability') + '">' + p.capability.map(function (c) { return '<li class="tag">' + esc(c) + '</li>'; }).join('') + '</ul>' +
          '<ul class="chips" aria-label="' + u('stack') + '">' + p.stack.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' +
          '<div class="proj-foot"><span class="count">' + pad(i + 1) + ' ' + u('of') + ' ' + pad(items.length) + '</span><a class="more" href="#">' + u('readCase') + ' <span aria-hidden="true">→</span></a></div>' +
        '</div></article>';
    }).join('');
    return '<section id="work" aria-labelledby="work-h">' + head(2, 'work', items.length + ' ' + u('projects')) + '<div class="projects">' + cards + '</div></section>';
  }

  function renderExperience() {
    var items = list(C.experience);
    var rows = items.map(function (e, i) {
      var now = e.period.status === 'present';
      return '<li class="row"><div class="when"><span class="eid">E-' + pad(i + 1) + '</span>' + (now ? '<span class="now-dot" aria-hidden="true"></span>' : '') + period(e.period) + '</div>' +
        '<div class="what"><h3>' + esc(t(e.org)) + '</h3><p class="r">' + esc(t(e.role)) + '</p><p>' + esc(t(e.summary)) + '</p></div></li>';
    }).join('');
    return '<section id="experience" aria-labelledby="experience-h">' + head(3, 'experience', items.length + ' ' + u('positions')) + '<ol class="card rows">' + rows + '</ol></section>';
  }

  var LIMIT = 5;
  function renderPatents() {
    var all = list(C.patents).slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var nReg = all.filter(function (p) { return p.status === 'registered'; }).length;
    var nFiled = all.length - nReg;
    var shown = state.patentFilter === 'all' ? all : all.filter(function (p) { return p.status === state.patentFilter; });
    var visible = state.patentsOpen ? shown : shown.slice(0, LIMIT);
    var rows = visible.map(function (p) {
      var reg = p.status === 'registered';
      var idx = all.indexOf(p) + 1;
      var meta = [p.number ? (reg ? u('reg') : u('appl')) + ' ' + p.number : null, ym(p.date)].filter(Boolean).join('  ·  ');
      return '<li class="pat"><span class="no">PT-' + pad(idx) + '</span><span class="t">' + esc(t(p.title)) + '</span>' +
        '<span class="st' + (reg ? ' reg' : '') + '">' + u(reg ? 'registered' : 'filed') + '</span><span class="m">' + esc(meta) + '</span></li>';
    }).join('');
    var f = function (key, n) { return '<button type="button" data-pf="' + key + '" aria-pressed="' + (state.patentFilter === key) + '">' + u(key) + ' ' + n + '</button>'; };
    var more = shown.length > LIMIT
      ? '<div class="plist-foot"><button type="button" class="btn" id="pToggle" aria-expanded="' + state.patentsOpen + '" aria-controls="plist">' +
          (state.patentsOpen ? u('showLess') : u('showAll') + ' (' + shown.length + ')') + '</button></div>'
      : '';
    return '<section id="patents" aria-labelledby="patents-h">' + head(4, 'patents', all.length + ' ' + u('entries')) +
      '<div class="card">' +
        '<div class="tools"><div class="seg" role="group" aria-label="' + u('patents') + '">' + f('all', all.length) + f('registered', nReg) + f('filed', nFiled) + '</div>' +
        '<span class="count"><b>' + visible.length + '</b> ' + u('of') + ' ' + shown.length + '</span></div>' +
        '<ol class="plist" id="plist">' + rows + '</ol>' + more +
      '</div></section>';
  }

  function render() {
    root.lang = state.lang;
    document.querySelector('[data-i="skip"]').textContent = u('skip');
    renderSidebar();
    document.getElementById('wrap').innerHTML = renderAbout() + renderWork() + renderExperience() + renderPatents() +
      '<footer class="colophon"><span>© ' + esc(t(P.name)) + '</span><span>' + u('draft') + '</span></footer>';
  }

  function setTheme(th) { root.dataset.theme = th; renderSidebar(); }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var keepFocus = null;
    if (b.dataset.lang) { state.lang = b.dataset.lang; render(); keepFocus = '[data-lang="' + state.lang + '"]'; }
    else if (b.id === 'themeBtn') { themeLocked = true; setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'); keepFocus = '#themeBtn'; }
    else if (b.dataset.pf) { state.patentFilter = b.dataset.pf; state.patentsOpen = false; rerenderPatents(); keepFocus = '[data-pf="' + b.dataset.pf + '"]'; }
    else if (b.id === 'pToggle') { state.patentsOpen = !state.patentsOpen; rerenderPatents(); keepFocus = '#pToggle'; }
    if (keepFocus) { var el = document.querySelector(keepFocus); if (el) el.focus(); }
  });

  function rerenderPatents() {
    var old = document.getElementById('patents');
    var tmp = document.createElement('div');
    tmp.innerHTML = renderPatents();
    old.replaceWith(tmp.firstChild);
  }

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (m) {
    if (!themeLocked) setTheme(m.matches ? 'dark' : 'light');
  });

  render();
})();
</script>
</body>
</html>
