  - en: Architecture and PoC for LLM agent and RAG services
    ko: LLM 에이전트·RAG 서비스 아키텍처 설계와 PoC
  - en: Physical AI and humanoid robot projects, from system architecture to VLA data and training pipelines
    ko: 시스템 아키텍처부터 VLA 데이터·학습 파이프라인까지 Physical AI·휴머노이드 로봇 프로젝트
