name: { en: 'Kwang Myung Yu', ko: '유광명' }
headline: { en: 'AI Engineer', ko: 'AI Engineer' }
currentRole: { en: 'Director, R&D Group, GenON', ko: 'GenON R&D그룹 Director' }
contact:
  email: sguys99@naver.com
  github: https://github.com/sguys99
