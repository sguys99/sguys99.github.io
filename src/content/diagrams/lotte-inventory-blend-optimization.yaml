# 그린소재 재고 조합 최적화 케이스 스터디 다이어그램 (DESIGN.md 5.24.4, 11.14). 시안 g12에서 고른 조합:
# problem = A(현행·개선 두 줄), arch = A(학습 프로그램 | MixPlanner 엔진, 바닥에 데이터 원천), flow = A(담당자·자동화 스윔레인, 4단계 열).
# 출처: docs/project-references/green-material/ 최종보고(9, 10, 15–21, 31–34, 41, 43장).
# 고객 내부 명칭은 일반화(믹싱 계획 시스템), 제품 브랜드·제품 코드는 싣지 않는다. MixPlanner와 함수명은 수행팀이 만든 패키지 이름.
# 포인트 색(focus)은 점도 예측 모델에만. 좌표는 SVG 단위(4px 격자), 연결선은 직각 + 모서리 반지름 8.
# d 경로는 시안 생성기(docs/design-drafts/g12/specs.mjs의 poly)가 만든 값이다.

