# 04 Approach 아래 실험 결과(최종보고 35장): 같은 시험 구간의 7개 구성. set 순서는 settings와 같다.
results:
  max: 16
  ticks: [0, 5, 10, 15]
  target: { value: 10, label: { en: 'TARGET 10%', ko: '목표 10%' } }
  benchmark: { value: 5.9, label: { en: BENCHMARK, ko: '벤치마크' } }
  ruleNote: { en: 'rule, no model', ko: '규칙, 모델 없음' }
  settings:
    - { short: { en: feat., ko: '피처' }, name: { en: feature selection, ko: '피처 선별' } }
    - { short: { en: lags, ko: lag }, name: { en: lag features, ko: 'lag 피처' } }
    - {
        short: { en: 'Δ y', ko: '변화량' },
        name: { en: price-change target, ko: '가격 변화량 타깃' },
      }
    - { short: { en: recur., ko: '재귀' }, name: { en: recursive forecasting, ko: '재귀 예측' } }
    - { short: { en: retrain, ko: '재학습' }, name: { en: retraining, ko: '재학습' } }
    - { short: { en: interp., ko: '보간' }, name: { en: target interpolation, ko: '타깃 보간' } }
  rows:
    - { label: { en: Persistence, ko: Persistence }, mape: 5.9, rule: true }
    - { label: { en: Linter-price rule, ko: '린터 가격 규칙' }, mape: 9.7, rule: true }
    - {
        label: { en: Linear Regression, ko: Linear Regression },
        mape: 13.3,
        set: [false, false, false, false, false, false],
      }
    - {
        label: { en: Random Forest, ko: Random Forest },
        mape: 6.3,
        set: [true, true, false, true, true, false],
      }
    - { label: { en: XGBoost, ko: XGBoost }, mape: 7, set: [true, true, false, true, true, false] }
    - {
        label: { en: 'Random Forest, Δ', ko: 'Random Forest, 변화량' },
        mape: 2.5,
        set: [true, true, true, true, true, true],
      }
    - {
        label: { en: 'XGBoost, Δ', ko: 'XGBoost, 변화량' },
        mape: 1.3,
        set: [true, true, true, true, true, true],
        best: true,
      }
  note:
    {
      en: 'Final comparison on one test window. Δ: the model predicts the price change instead of the price.',
      ko: '같은 시험 구간에서 비교한 최종 결과. 변화량: 가격 대신 가격 변화량을 예측.',
    }
