# 원자재 가격 예측 케이스 스터디 다이어그램 (DESIGN.md 5.24.4·5.24.6, 11.12). 시안 g10에서 고른 조합:
# arch = A(학습 파이프라인 + 현업 대시보드 두 구역), flow = C(구매 절차 개요 + 견적 검토 확대), results = B(최종 비교 막대 + 설정 행렬).
# 출처: docs/project-references/price-forecasting/ 최종보고(6, 15–16, 25–35, 36–40장). 원자재·출처 명칭은 사용자 승인(2026-11-21).
# 포인트 색은 예측 모델(focus)과 최종 모델 막대에만. 좌표는 SVG 단위(4px 격자), 연결선은 직각 + 모서리 반지름 8.

legend:
  - kind: focus
    label: { en: Forecast model, ko: '예측 모델' }
  - kind: llm
    label: { en: Pipeline step, ko: '파이프라인 단계' }
  - kind: logic
    label: { en: Evaluation, ko: '평가' }
  - kind: plain
    label: { en: Dashboard page, ko: '대시보드 페이지' }
  - kind: input
    label: { en: External data, ko: '외부 데이터' }

