# SCM 케이스 스터디 다이어그램 (DESIGN.md 5.24.4, 11.10).
# arch: 서비스 구성도, flow: 서비스 흐름도. 출처는 프로젝트 service flow 자료(구성도, 흐름도 G-Matrix 2.0판).
# 고객 내부 명칭(시스템·플랫폼·제품명)과 인프라 사양은 일반 명칭으로 바꿨다. 모델은 사이트 확정 기준(Qwen 8B 파인튜닝 2역할, Llama 3.1 70B).
# 좌표는 SVG 단위(4px 격자). 연결선 d는 직각 + 모서리 반지름 8, 한 변에서 나가는 선은 연결 지점을 따로 두고 겹치지 않게 (diagram-design 규칙 3·4).

