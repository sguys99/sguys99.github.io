# 명령에서 토크까지: 회사소개서 "로봇 지능 계층 구조"의 예시(Illustrative)를 다시 그린 것. 모델·위치는 제품 사양서 Ⅰ.2.
stack:
  command: { en: '“Go to where the red cup is”', ko: '“빨간 컵 있는 곳으로 가”' }
  descent:
    {
      en: 'LOWER LAYERS USE LESS INPUT FOR FINER CONTROL',
      ko: '하위 계층일수록 적은 정보로 정밀하게 제어',
    }
  layers:
    - name: { en: Perception and mapping, ko: '인지/매핑' }
      does: { en: 'Maps the space, finds the goal', ko: 지도를 만들고 목표를 좌표로 }
      where: { en: 'FSR-VLN (local server)', ko: 'FSR-VLN(로컬 서버)' }
      out: { en: GOAL COORDINATES, ko: 목표 좌표 }
      sample: coords
      value: '[2.3, 1.1, 0.8]'
    - name: { en: VLA policy, ko: 상위 지능 (VLA) }
      does: { en: Turns the goal into next motions, ko: 목표를 앞으로 취할 동작으로 }
      where: { en: 'GR00T N1.7 (local server)', ko: 'GR00T N1.7(로컬 서버)' }
      out: { en: 'ACTION CHUNK (16 STEPS × 29 JOINTS)', ko: '액션 청크(16 스텝 × 관절 29개)' }
      sample: chunk
      focus: true
    - name: { en: Whole-body control, ko: 전신 제어 }
      does: { en: 'Sets each step’s pose, keeps balance', ko: '매 스텝 자세 결정, 균형/접촉 처리' }
      where: { en: 'GEAR-SONIC (on-board PC2)', ko: 'GEAR-SONIC(온보드 PC2)' }
      out: { en: '29 JOINT TARGETS', ko: '관절 목표각 29개' }
      sample: joints
    - name: { en: Motors, ko: 하드웨어 (모터) }
      does: { en: Drives joints to close the error, ko: 목표와 현재 각의 오차를 줄이도록 구동 }
      where: { en: 'motor control (on-board PC1)', ko: '모터 제어(온보드 PC1)' }
      out: { en: JOINT TORQUE, ko: 관절 토크 }
      sample: torque
      value: 'τ = Kp(θ* − θ) − Kd·ω'
  note:
    en: 'Illustrative. One spoken command changes form at each layer, from language to coordinates, an action chunk, joint targets, and torque.'
    ko: '예시. 음성 명령 하나를 계층별로 자연어 → 좌표 → 액션 청크 → 관절 목표각 → 토크 순서로 변환.'
# 학습 루프: 회사소개서 "VLA 학습 데이터 구축 절차"·"VLA 모델 학습/평가". 시연 예시는 생활 지원 시연 시나리오(캔 분리수거).
episode:
  segments:
    - { en: move to the table, ko: 테이블로 이동 }
    - { en: grasp the can, ko: 캔 파지 }
    - { en: carry to the bin, ko: 분리수거함으로 이동 }
    - { en: 'drop, sort', ko: 분리수거 }
  tracks:
    - { key: L, name: { en: Language, ko: 언어 지시 } }
    - { key: V, name: { en: Vision, ko: 카메라 영상 } }
    - { key: S, name: { en: State, ko: 로봇 상태 } }
    - { key: A, name: { en: Action, ko: 행동 } }
    - { key: O, name: { en: Outcome, ko: 결과 } }
  instruction:
    {
      en: '“Pick up the can on the table and sort it into recycling”',
      ko: '“테이블 위 캔을 집어 분리수거함에 정리해”',
    }
  result: { en: success, ko: 성공 }
  steps:
    - name: { en: Collect, ko: 수집 }
      sub: { en: 'VR teleop, simulation', ko: 'VR Teleop/시뮬레이션' }
    - name: { en: 'Curate, label', ko: '정제/라벨링' }
      sub: { en: per segment, ko: 구간별 라벨 }
    - name: { en: Fine-tune VLA, ko: VLA 파인튜닝 }
      sub: { en: GR00T N1.7, ko: GR00T N1.7 }
    - name: { en: Evaluate, ko: 단계별 평가 }
      sub: { en: 'offline, sim, robot', ko: '오프라인/시뮬/실기' }
      focus: true
  back: { en: 'BELOW TARGET? COLLECT FAILURE SCENES', ko: '목표 미달 시 실패 장면 추가 수집' }
  metrics:
    en: 'Measured by success rate, generalization, safety, speed, and recovery.'
    ko: '평가 지표: 작업 성공률, 일반화 성능, 안전성, 수행 속도, 복구 능력'
  note:
    en: 'Record each demonstration as five tracks in the shared episode schema and label each segment.'
    ko: '시연 한 번을 공통 에피소드 스키마(EpisodeSchema)에 따라 다섯 트랙에 기록하고 구간별로 라벨링'
