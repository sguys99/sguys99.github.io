# GenP 휴머노이드 제품 케이스 스터디 다이어그램 (DESIGN.md 5.24.4, 5.24.9, 5.24.10, 11.15).
# approach: 공통 코어 + 도메인 프로파일 (교체 경계선), arch: Phase 2·3 목표 아키텍처의 배치와 경계,
# stack: 명령에서 토크까지 (계단), episode: 에피소드 해부 + 학습 루프.
# 출처: 제품 정의서 v0.3, 제품 사양서 v0.1, 아키텍처 rev0.6(Agentic 버전), 회사소개서(지능 계층·VLA 학습), 상용화 로드맵 v0.2(기술트리).
# 시안: docs/design-drafts/g14/ (core A, arch C, stack A, loop C). 시장·경쟁·가격·고객·기관 이름은 넣지 않는다 (CLAUDE.md 규칙 3).
# 좌표는 SVG 단위(4px 격자). 연결선 d는 직각 + 모서리 반지름 8 (diagram-design 규칙 3·4).

