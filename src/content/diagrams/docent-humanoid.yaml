# 도슨트 휴머노이드 케이스 스터디 다이어그램 (DESIGN.md 5.24.4, 11.13).
# journey: 로비 평면 개념도(관람 동선 섹션), arch: 구성도, safety: 접근 거리 원 + 3경로 비상정지(안전 체계 섹션).
# 출처: 착수보고서(4-1·4-2, 3-1~3-4, 5-1·5-2)와 포커스 세미나(7·10·11쪽). 시안: docs/design-drafts/g13/ (A, A, A).
# 고객사·브랜드·캐릭터·지역·협력사 이름과 서버 사양은 넣지 않는다 (CLAUDE.md 규칙 3). 로비 배치는 개념도.
# 좌표는 SVG 단위(4px 격자). 연결선 d는 직각 + 모서리 반지름 8 (diagram-design 규칙 3·4).

