# 고객 상담 어시스턴트 케이스 스터디 다이어그램 (DESIGN.md 5.24.4, 11.11). 시안 g11에서 고른 조합:
# problem = 여정 B(곡선 여정 지도), approach = 진화 A(버전별 파이프라인), arch = B(계층 스택), flow = A(세로 3갈래).
# 출처: docs/project-references/online-ai-assistant/프로젝트 개요.pdf (1장 고객 여정, 3장 플랫폼, 4~6장 Ver1~3).
# 제3자 서비스명(포털·쇼핑몰)은 일반 명칭으로. 포인트 색은 LLM 없이 답하는 Predefined(focus), 고충 번호, 버전별 추가 모듈(new)에만.
# 좌표는 SVG 단위(4px 격자). 연결선 d는 직각 + 모서리 반지름 8, 한 변에서 나가는 선은 연결 지점을 따로 둔다 (diagram-design 규칙 3·4).

legend:
  - kind: llm
    label: { en: LLM call, ko: LLM 호출 }
  - kind: logic
    label: { en: 'Logic, search, storage', ko: 로직·검색·저장소 }
  - kind: focus
    label: { en: Answered without the LLM, ko: LLM 없이 답변 }

