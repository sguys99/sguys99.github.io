    # 개발 준비 4건
    - {
        lane: dev,
        kind: dev,
        from: 5.5,
        to: 9.5,
        name: { en: Profit by utilization rate, ko: 가동률별 손익 시뮬레이션 },
      }
    - {
        lane: dev,
        kind: dev,
        from: 6,
        to: 8,
        name: { en: "Market news\ndigest", ko: "시장 동향\n요약 메일링" },
